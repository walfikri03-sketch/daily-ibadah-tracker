<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>Daily Ibadah Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#FAF8F4; --paper:#FFFFFF; --ink:#1B1B1B; --muted:#6E675C;
        --line:#DCD6CB; --line-soft:#E7E2D8; --accent:#1F5F4A; --accent-soft:#EAF1ED;
        --red:#B3261E; --amber-bg:#FBF3E2;
        color-scheme: light;
      }
      *{box-sizing:border-box;}
      html{-webkit-text-size-adjust:100%;}
      body{margin:0;background:var(--bg);color:var(--ink);
        font-family:"Source Sans 3",-apple-system,"Segoe UI",sans-serif;
        font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;}
      button,[role="button"],select,input{min-height:2.25rem;}
      button{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);
        border-radius:5px;padding:.35rem .7rem;cursor:pointer;}
      button:active{background:var(--accent-soft);}
      button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
      button.plain{border-color:transparent;background:transparent;}
      button:disabled{opacity:.45;cursor:default;}
      input,select{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);
        border-radius:5px;padding:.4rem .6rem;}
      a{color:var(--accent);}
      .wrap{max-width:1060px;margin:0 auto;padding:0 12px 48px;}

      /* Top bar */
      .topbar{border-bottom:1px solid var(--line);background:var(--bg);
        position:sticky;top:0;z-index:20;}
      .topbar-in{max-width:1060px;margin:0 auto;padding:8px 12px;display:flex;flex-wrap:wrap;
        gap:8px;align-items:center;}
      .who{font-size:.9rem;color:var(--muted);}
      .who strong{color:var(--ink);}
      .topbar .spacer{flex:1;}
      .topbar button{font-size:.9rem;padding:.3rem .6rem;}
      .admin-on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}

      .datenav{display:flex;align-items:center;gap:8px;padding:12px 0 4px;flex-wrap:wrap;}
      .datenav .date{font-size:1.25rem;font-weight:700;}
      .datenav .sub{color:var(--muted);font-size:.9rem;width:100%;}
      .datenav button{min-width:2.5rem;}

      /* Tabs */
      .tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-top:8px;overflow-x:auto;}
      .tabs button{border:none;background:transparent;border-radius:0;padding:.55rem .9rem;
        font-size:1rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;}
      .tabs button.active{color:var(--ink);font-weight:700;border-bottom-color:var(--accent);}

      .banner{border:1px solid var(--line);border-left:4px solid var(--red);background:var(--paper);
        padding:10px 12px;margin:14px 0;border-radius:4px;font-size:.95rem;}
      .banner.offline{border-left-color:#8a6d1a;background:var(--amber-bg);}
      .banner.ok{border-left-color:var(--accent);}
      .banner h2{margin:0 0 6px;font-size:1.05rem;}
      .banner p{margin:4px 0;}
      .banner code{background:var(--bg);border:1px solid var(--line-soft);padding:0 4px;border-radius:3px;font-size:.85em;}

      h2.sec{font-size:1.05rem;margin:22px 0 8px;font-weight:700;}
      .note{color:var(--muted);font-size:.88rem;}
      .empty{border:1px solid var(--line-soft);background:var(--paper);padding:14px;border-radius:5px;color:var(--muted);}

      /* Ledger tables */
      .tablebox{border:1px solid var(--line);background:var(--paper);border-radius:5px;overflow:hidden;}
      table.ledger{border-collapse:collapse;width:100%;table-layout:fixed;}
      table.ledger th,table.ledger td{border-bottom:1px solid var(--line-soft);
        border-right:1px solid var(--line-soft);padding:5px 2px;text-align:center;
        font-size:.82rem;overflow:hidden;}
      table.ledger th:last-child,table.ledger td:last-child{border-right:none;}
      table.ledger tr:last-child td{border-bottom:none;}
      table.ledger thead th{background:#F3F0E9;font-weight:600;font-size:.68rem;color:var(--muted);
        padding:5px 1px;line-height:1.15;word-break:break-word;}
      table.ledger td.person,table.ledger th.person{text-align:left;padding-left:8px;width:92px;}
      td.person .nm{font-weight:600;font-size:.9rem;display:block;line-height:1.2;}
      td.person .upd{color:var(--muted);font-size:.7rem;display:block;line-height:1.25;}
      td.person button.namelink{border:none;background:none;padding:0;min-height:0;text-align:left;
        font-weight:600;font-size:.9rem;color:var(--ink);text-decoration:underline;
        text-decoration-color:var(--line);text-underline-offset:2px;}
      .done-mark{color:var(--accent);font-weight:700;}
      .partial{font-size:.72rem;color:var(--ink);}
      .missed{color:var(--red);}
      .me-row td{background:var(--accent-soft);}
      .me-row td.person{background:var(--accent-soft);}
      td.pct,th.pct{width:52px;font-weight:700;}
      .legend{font-size:.78rem;color:var(--muted);margin-top:6px;line-height:1.5;}
      .legend b{color:var(--ink);font-weight:600;}

      /* Checklist */
      .group-head{font-size:.95rem;font-weight:700;margin:20px 0 6px;padding-bottom:4px;
        border-bottom:1px solid var(--line);}
      .item{border:1px solid var(--line);background:var(--paper);border-radius:5px;
        padding:10px 12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;}
      .item.done{border-color:var(--accent);}
      .item .main{flex:1;min-width:0;}
      .item .name{font-weight:600;font-size:1rem;line-height:1.3;}
      .item .desc{color:var(--muted);font-size:.87rem;margin-top:1px;}
      .badge{display:inline-block;font-size:.72rem;font-weight:600;color:var(--accent);
        border:1px solid var(--accent);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;}
      .badge.grey{color:var(--muted);border-color:var(--line);}
      .cbox{flex:none;width:34px;height:34px;min-height:34px;border:2px solid var(--muted);
        border-radius:5px;background:var(--paper);font-size:1.25rem;line-height:1;padding:0;
        color:var(--accent);display:flex;align-items:center;justify-content:center;}
      .cbox.on{border-color:var(--accent);background:var(--accent-soft);}
      .cbox:disabled{opacity:.5;}
      .counter{flex:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
      .counter button{width:40px;height:40px;min-height:40px;font-size:1.15rem;padding:0;}
      .counter .val{font-weight:700;font-size:1.05rem;min-width:74px;text-align:center;}
      .counter .val small{color:var(--muted);font-weight:400;}
      .quick{display:flex;gap:6px;width:100%;justify-content:flex-end;}
      .quick button{width:auto;height:32px;min-height:32px;font-size:.82rem;padding:0 10px;}
      .ro-mark{flex:none;font-weight:700;color:var(--accent);font-size:1rem;padding-top:6px;}
      .ro-mark .cnt{color:var(--ink);font-weight:600;}
      .ro-mark .notdone{color:var(--muted);font-weight:400;font-size:.9rem;}

      /* Activity feed */
      .feed{border:1px solid var(--line);background:var(--paper);border-radius:5px;}
      .feed div{padding:7px 12px;border-bottom:1px solid var(--line-soft);font-size:.93rem;}
      .feed div:last-child{border-bottom:none;}
      .feed .t{color:var(--muted);font-size:.85rem;}

      /* Setup */
      .setup{max-width:520px;margin:0 auto;padding:28px 12px 48px;}
      .setup h1{font-size:1.4rem;margin:0 0 6px;}
      .setup p{color:var(--muted);margin:0 0 18px;}
      .namelist{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
      .namelist button{text-align:left;padding:.7rem .9rem;font-size:1.02rem;}
      .namelist button.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:700;}
      .pinrow{display:flex;gap:8px;align-items:stretch;}
      .pinrow input{flex:1;font-size:1.3rem;letter-spacing:.4em;text-align:center;}
      .err{color:var(--red);font-size:.92rem;margin-top:10px;min-height:1.2em;}

      /* 7-day strip */
      .strip{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);
        background:var(--paper);border-radius:5px;overflow:hidden;}
      .strip div{padding:7px 2px;text-align:center;border-right:1px solid var(--line-soft);font-size:.85rem;}
      .strip div:last-child{border-right:none;}
      .strip .d{display:block;color:var(--muted);font-size:.7rem;}
      .strip .sel{background:var(--accent-soft);}

      .modal{border:1px solid var(--line);background:var(--paper);border-radius:5px;
        padding:14px;margin:14px 0;}
      .modal h3{margin:0 0 8px;font-size:1rem;}
      .rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
      .loading{padding:40px 0;text-align:center;color:var(--muted);}
      @media (max-width:560px){
        table.ledger td.person,table.ledger th.person{width:76px;}
        td.person .upd{display:none;}
        .counter .val{min-width:64px;}
      }
    </style>
  </head>

    <script>
    "use strict";
    /* ============ Configuration ============ */
    var SUPABASE_URL = "https://fiixgsjfjcisqjxgqfvu.supabase.co";
    var SUPABASE_KEY = "sb_publishable_xHx91jPBByJ0C0lNV8I0Ag_tc1AoVWo";

    /* ============ Items ============ */
    /* due: "daily" | "week" (any day this week) | "fri" | "sat-sun" | "month" | "first-wed" */
    var ITEMS = [
      {id:"yasin",       code:"YS", group:"Daily", name:"Yasin-i Şerif Hatmi", desc:"Full reading of Surah Yasin, every morning.", due:"daily"},
      {id:"ayetulkursi", code:"AK", group:"Daily", name:"Ayetül Kürsi Hatmi", desc:"Recitation of Ayat al-Kursi, every morning.", due:"daily"},
      {id:"teheccut",    code:"TC", group:"Daily", name:"Teheccüt Namazı", desc:"Night prayer, before dawn.", due:"daily"},

      {id:"mumin",       code:"MM", group:"Daily", name:"Mumin (Gafir) Süresi, 3x", desc:"Surah Ghafir, 3 times, morning and evening.", target:3, due:"daily"},
      {id:"cunnetul",    code:"CE", group:"Daily", name:"Cünnet-ül Esma, 19x", desc:"Cunnet-ul Esma, 19 times, alone, at a free time.", target:19, due:"daily"},
      {id:"vallahu",     code:"VG", group:"Daily", name:"Vallahu Galibun Ala Emrih Hatmi, 1461x", desc:"Recited 1461 times after Yasin-i Şerif, if applicable.", target:1461, due:"daily"},
      {id:"munciye",     code:"SM", group:"Daily", name:"Salat-ı Münciye, 1000x", desc:"Salat al-Munjiyah, 1000 times, in the morning.", target:1000, due:"daily"},
      {id:"nariye",      code:"SN", group:"Daily", name:"Salat-ı Nariye, 4444x", desc:"Salat al-Nariyah, 4444 times, after the morning prayer.", target:4444, due:"daily"},

      {id:"kuranhatmi",  code:"KH", group:"Weekly", name:"Kuran-ı Kerim Hatmi", desc:"Complete reading of the Quran, at least once a week.", due:"week", badge:"Due this week"},
      {id:"hatmievbiya", code:"HE", group:"Weekly", name:"Hatmi Evbiya", desc:"Once a week, after the evening prayer.", due:"week", badge:"Due this week"},

      {id:"hacet",       code:"HC", group:"Weekly", name:"Hacet Namazıyla İltica, 12 rakat", desc:"Prayer of need, 12 rakats, once a week on Saturday or Sunday evening.", due:"sat-sun"},
      {id:"tesbih",      code:"TN", group:"Weekly", name:"Tesbih Namazı", desc:"Once a week, on Friday evening.", due:"fri"},
      {id:"secde",       code:"SA", group:"Weekly", name:"Secde Ayetleriyle İltica", desc:"Once a week, with the prostration verses.", due:"week", badge:"Due this week"},
      {id:"lehevle",     code:"LH", group:"Weekly", name:"Le Hevle Ve Le Quvvete Hatmi, 500x", desc:"500 times, twice a month.", target:500, due:"week", badge:"Twice a month"},

      {id:"istigfar",    code:"IS", group:"Monthly", name:"İstiğfar Hatmi, 1001x", desc:"1001 times, on the first Wednesday of the month, together with the Nakşi hatmi.", target:1001, due:"first-wed"},
      {id:"fatir",       code:"FT", group:"Monthly", name:"Fatir Süresinin 41. Ayeti, 400x", desc:"Verse 41 of Surah Fatir, 400 times, once a month, alone.", target:400, due:"month", badge:"Due this month"},
      {id:"tevhid",      code:"KT", group:"Monthly", name:"Kelime-i Tevhid Hatmi, 70.000x", desc:"70,000 times, following the schedule.", target:70000, due:"month", badge:"Due this month"}
    ];
    var ITEM_BY_ID = {};
    ITEMS.forEach(function(it){ ITEM_BY_ID[it.id]=it; });

    function isDue(item, date){
      var dow = date.getDay();
      switch(item.due){
        case "daily": return true;
        case "week": return true;
        case "month": return true;
        case "fri": return dow===5;
        case "sat-sun": return dow===0 || dow===6;
        case "first-wed": return dow===3 && date.getDate()<=7;
      }
      return true;
    }
    function dueItems(date){ return ITEMS.filter(function(it){ return isDue(it,date); }); }
    function badgeFor(item){
      if(item.due==="daily"||item.due==="fri"||item.due==="sat-sun"||item.due==="first-wed") return "Due today";
      return item.badge || "Due today";
    }

    /* ============ Date helpers (local time) ============ */
    function pad(n){ return (n<10?"0":"")+n; }
    function dstr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
    function parseD(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
    function addDays(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
    function mondayOf(d){ var x=addDays(d,0); var dow=(x.getDay()+6)%7; return addDays(x,-dow); }
    var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
    var MON_S=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var DOW_S=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    function fmtDate(d){ return DOW_S[(d.getDay()+6)%7]+", "+d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }
    function fmtTime(iso){
      var d=new Date(iso); if(isNaN(d)) return "";
      var t=pad(d.getHours())+":"+pad(d.getMinutes());
      var today=new Date();
      if(dstr(d)===dstr(today)) return t;
      return d.getDate()+" "+MON_S[d.getMonth()]+", "+t;
    }
    function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

    /* ============ State ============ */
    var sb = null;
    var state = {
      me: null, admin:false, adminPanel:false,
      view:"today",            /* today | mine | person | week | export */
      personView:null,
      selDate:new Date(),
      weekStart:mondayOf(new Date()),
      checkins:{},             /* key person|date|itemId -> row */
      activity:[],
      lastUpdated:{},          /* person -> iso */
      queue:[],                /* offline write ops */
      online: navigator.onLine,
      setupError:null,         /* string when tables missing */
      bootError:null,
      setupName:null, setupMsg:""
    };
    function key(person,date,itemId){ return person+"|"+date+"|"+itemId; }
    function getCI(person,date,itemId){ return state.checkins[key(person,date,itemId)] || null; }

    try{
      var saved = localStorage.getItem("ibadah-identity");
      if(saved){ var p=JSON.parse(saved); if(PEOPLE.indexOf(p.person)>=0) state.me=p.person; }
    }catch(e){}

    /* ============ PIN hashing ============ */
    function pinHash(person,pin){
      var s="ibadah:"+person+":"+pin;
      if(window.crypto && crypto.subtle && window.isSecureContext){
        return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(buf){
          return Array.prototype.map.call(new Uint8Array(buf),function(b){return pad(b.toString(16));}).join("");
        });
      }
      var h1=0xdeadbeef,h2=0x41c6ce57;
      for(var i=0;i<s.length;i++){ var ch=s.charCodeAt(i);
        h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
      h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
      h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
      return Promise.resolve((h2>>>0).toString(16)+(h1>>>0).toString(16));
    }

    <script>
    "use strict";
    /* ============ Supabase data layer ============ */
    function isMissingTable(err){
      if(!err) return false;
      var m=(err.message||"")+" "+(err.code||"");
      return /42P01|PGRST205|does not exist|Could not find the table|relation .* does not exist/i.test(m);
    }
    function noteError(err){
      if(isMissingTable(err) && !state.setupError){
        state.setupError = "The Supabase tables were not found. The database setup is not complete: " +
          "the tables checkins, activity, identities, corrections and settings must be created first " +
          "(SQL Editor in the Supabase project), with row level security policies for the anon role and " +
          "checkins and activity added to the Realtime publication. No data is shown until this is done.";
        render();
      }
    }
    function mergeRow(row){
      state.checkins[key(row.person,row.check_date,row.item_id)] = row;
      if(!state.lastUpdated[row.person] || row.updated_at > state.lastUpdated[row.person])
        state.lastUpdated[row.person] = row.updated_at;
    }
    function loadCheckins(from,to){
      return sb.from("checkins").select("*").gte("check_date",from).lte("check_date",to)
        .then(function(res){
          if(res.error){ noteError(res.error); return; }
          (res.data||[]).forEach(mergeRow);
        }).catch(function(e){ /* offline: keep what we have */ });
    }
    function loadLastUpdated(){
      return sb.from("checkins").select("person,updated_at").order("updated_at",{ascending:false}).limit(400)
        .then(function(res){
          if(res.error){ noteError(res.error); return; }
          (res.data||[]).forEach(function(r){
            if(!state.lastUpdated[r.person]) state.lastUpdated[r.person]=r.updated_at;
          });
        }).catch(function(){});
    }
    function loadActivity(){
      return sb.from("activity").select("*").order("created_at",{ascending:false}).limit(40)
        .then(function(res){
          if(res.error){ noteError(res.error); return; }
          state.activity = res.data||[];
        }).catch(function(){});
    }
    function ensureRange(center){
      var from=dstr(addDays(center,-16)), to=dstr(addDays(center,16));
      return Promise.all([loadCheckins(from,to), loadLastUpdated(), loadActivity()]);
    }

    /* ============ Editing ============ */
    function canEdit(person){ return state.me===person || (state.admin && state.me===ADMIN_PERSON); }
    function oldValText(row,item){
      if(!row) return "not done";
      if(item.target) return (row.count||0)+"/"+item.target;
      return row.done ? "done" : "not done";
    }
    function applyLocal(person,date,itemId,done,count,target){
      var k=key(person,date,itemId);
      state.checkins[k]={person:person,check_date:date,item_id:itemId,done:done,
        count:count,target:target,updated_at:new Date().toISOString()};
      state.lastUpdated[person]=state.checkins[k].updated_at;
    }
    function setCheck(person,date,item,done,count){
      var row=getCI(person,date,item.id);
      var oldText=oldValText(row,item);
      var target=item.target||null;
      if(item.target){ count=Math.max(0,Math.min(item.target,count)); done = count>=item.target; }
      else { count=0; done=!!done; }
      var newText = item.target ? (count+"/"+item.target) : (done?"done":"not done");
      if(oldText===newText){ render(); return; }
      applyLocal(person,date,item.id,done,count,target);
      render();

      var ops=[];
      ops.push({table:"checkins", method:"upsert", payload:{
        person:person, check_date:date, item_id:item.id, done:done, count:count,
        target:target, updated_at:new Date().toISOString()}});
      /* Activity entry */
      var action;
      if(state.admin && state.me===ADMIN_PERSON && person!==state.me){
        action="corrected";
        ops.push({table:"activity", method:"insert", payload:{
          person:state.me, item_name:item.name+" (for "+person+", "+date+")", action:"corrected"}});
        ops.push({table:"corrections", method:"insert", payload:{
          admin_person:state.me, person:person, check_date:date, item_id:item.id,
          old_value:oldText, new_value:newText}});
      }else{
        if(item.target) action = done ? "finished" : "updated";
        else action = done ? "finished" : "unchecked";
        ops.push({table:"activity", method:"insert", payload:{
          person:person, item_name:item.name, action:action}});
      }
      runOps(ops);
    }
    function runOps(ops){
      if(!state.online){ state.queue.push.apply(state.queue,ops); render(); return; }
      var chain=Promise.resolve();
      ops.forEach(function(op){
        chain=chain.then(function(){
          var q = op.method==="upsert"
            ? sb.from(op.table).upsert(op.payload,{onConflict:"person,check_date,item_id"})
            : sb.from(op.table).insert(op.payload);
          return q.then(function(res){ if(res.error) noteError(res.error); });
        }).catch(function(){
          /* network failure mid-write: queue the rest */
          state.queue.push(op);
        });
      });
      chain.then(function(){ render(); });
    }
    function flushQueue(){
      if(!state.queue.length || !state.online) return;
      var ops=state.queue.splice(0,state.queue.length);
      runOps(ops);
    }

    /* ============ Completion maths ============ */
    function dayStats(person,dateObj){
      var ds=dstr(dateObj), items=dueItems(dateObj), doneN=0, frac=0;
      items.forEach(function(it){
        var r=getCI(person,ds,it.id);
        if(!r) return;
        if(it.target){ var f=Math.min(1,(r.count||0)/it.target); frac+=f; if(r.done||f>=1) doneN++; }
        else if(r.done){ frac+=1; doneN++; }
      });
      return {total:items.length, done:doneN, frac:items.length?frac/items.length:0};
    }
    function cellMark(person,dateObj){
      var ds=dstr(dateObj), items=dueItems(dateObj);
      var st=dayStats(person,dateObj);
      if(st.done===st.total && st.total>0) return {cls:"done-mark", txt:"\u2713"};
      if(st.frac>0) return {cls:"partial", txt:st.done+"/"+st.total};
      var today=new Date();
      if(ds<dstr(today)) return {cls:"missed", txt:"\u2014"};
      return {cls:"", txt:""};
    }

    /* ============ Rendering ============ */
    var app=document.getElementById("app");
    function render(){
      if(state.setupError){ app.innerHTML = setupErrorView(); return; }
      if(state.bootError){ app.innerHTML = '<div class="wrap"><div class="banner"><h2>Could not connect</h2><p>'+
        esc(state.bootError)+'</p><p><button data-act="reload">Try again</button></p></div></div>'; return; }
      if(!state.me){ app.innerHTML = setupView(); return; }
      if(state.me!==ADMIN_PERSON){ state.admin=false; state.adminPanel=false; }
      var h = topbar();
      h += '<div class="wrap">';
      if(!state.online || state.queue.length) h += offlineBanner();
      if(state.adminPanel) h += adminPanel();
      if(state.view==="today") h += todayView();
      else if(state.view==="mine") h += checklistView(state.me, state.selDate, true);
      else if(state.view==="person") h += personView();
      else if(state.view==="week") h += weekView();
      else if(state.view==="export") h += exportView();
      h += "</div>";
      app.innerHTML = h;
    }
    function setupErrorView(){
      return '<div class="wrap"><div class="banner"><h2>Setup is not complete</h2><p>'+
        esc(state.setupError)+'</p><p><button data-act="reload">Check again</button></p></div></div>';
    }
    function offlineBanner(){
      var msg = !state.online
        ? "You are offline. Changes are kept on this screen and sent when you are back online."
        : "Back online. Sending queued changes\u2026";
      if(state.queue.length) msg += " Queued changes: "+state.queue.length+".";
      return '<div class="banner offline">'+esc(msg)+"</div>";
    }
    function topbar(){
      var tabs=[["today","Today"],["mine","My checklist"],["week","Week"],["export","Export"]];
      var h='<div class="topbar"><div class="topbar-in">';
      h+='<span class="who">Signed in as <strong>'+esc(state.me)+'</strong></span>';
      h+='<span class="spacer"></span>';
      if(state.me===ADMIN_PERSON) h+='<button data-act="admin" class="'+(state.admin?"admin-on":"")+'">'+(state.admin?"Admin on":"Admin")+"</button>";
      h+='<button data-act="switch">Switch user</button>';
      h+="</div>";
      h+='<div class="topbar-in" style="padding-top:0;"><nav class="tabs" style="flex:1;">';
      tabs.forEach(function(t){
        h+='<button data-act="tab" data-v="'+t[0]+'" class="'+(state.view===t[0]||(t[0]==="mine"&&state.view==="person"&&state.personView===state.me)?"active":"")+'">'+t[1]+"</button>";
      });
      h+="</nav></div></div>";
      return h;
    }
    function dateNav(){
      var d=state.selDate, isToday=dstr(d)===dstr(new Date());
      var h='<div class="datenav">';
      h+='<button data-act="prev-day" aria-label="Previous day">\u2190</button>';
      h+='<span class="date">'+(isToday?"Today":fmtDate(d))+"</span>";
      h+='<button data-act="next-day" aria-label="Next day">\u2192</button>';
      if(!isToday) h+='<button data-act="goto-today">Go to today</button>';
      h+='<span class="sub">'+fmtDate(d)+"</span></div>";
      return h;
    }

    /* --- Today --- */
    function todayView(){
      var d=state.selDate, ds=dstr(d), items=dueItems(d);
      var h=dateNav();
      h+="<h2 class=\"sec\">Today's table</h2>";
      h+='<div class="tablebox"><table class="ledger"><thead><tr><th class="person">Person</th>';
      items.forEach(function(it){ h+="<th>"+it.code+"</th>"; });
      h+="</tr></thead><tbody>";
      PEOPLE.forEach(function(p){
        h+='<tr class="'+(p===state.me?"me-row":"")+'"><td class="person">'+
          '<button class="namelink" data-act="open-person" data-p="'+esc(p)+'">'+esc(p)+"</button>"+
          '<span class="upd">'+(state.lastUpdated[p]?"Updated "+fmtTime(state.lastUpdated[p]):"No entries yet")+"</span></td>";
        items.forEach(function(it){
          var r=getCI(p,ds,it.id), cell;
          if(r && (r.done || (it.target && (r.count||0)>=it.target))) cell='<span class="done-mark">\u2713</span>';
          else if(r && it.target && (r.count||0)>0) cell='<span class="partial">'+r.count+"/"+it.target+"</span>";
          else if(r && r.done) cell='<span class="done-mark">\u2713</span>';
          else if(ds<dstr(new Date())) cell='<span class="missed">\u2014</span>';
          else cell="";
          h+="<td>"+cell+"</td>";
        });
        h+="</tr>";
      });
      h+="</tbody></table></div>";
      h+='<p class="legend">'+items.map(function(it){return "<b>"+it.code+"</b> "+esc(it.name);}).join(" \u00b7 ")+"</p>";
      h+='<p style="margin:16px 0 4px;"><button class="primary" data-act="tab" data-v="mine">Your checklist</button></p>';

      h+="<h2 class=\"sec\">Activity</h2>";
      if(!state.activity.length) h+='<div class="empty">No activity yet.</div>';
      else{
        h+='<div class="feed">';
        state.activity.slice(0,25).forEach(function(a){
          h+="<div>"+esc(a.person)+" "+esc(a.action)+" "+esc(a.item_name)+
             ' <span class="t">, '+esc(fmtTime(a.created_at))+"</span></div>";
        });
        h+="</div>";
      }
      return h;
    }

    /* --- Checklist (mine / person detail) --- */
    function checklistView(person,date,editable){
      var ds=dstr(date), items=dueItems(date);
      var groups=["Daily","Weekly","Monthly"];
      var h="";
      groups.forEach(function(g){
        var gi=items.filter(function(it){return it.group===g;});
        if(!gi.length) return;
        h+='<div class="group-head">'+g+"</div>";
        gi.forEach(function(it){ h+=itemRow(person,ds,it,editable); });
      });
      if(!items.length) h+='<div class="empty">No items due on this day.</div>';
      return h;
    }
    function itemRow(person,ds,it,editable){
      var r=getCI(person,ds,it.id);
      var count=r?(r.count||0):0;
      var done=r ? (it.target ? (r.done || count>=it.target) : !!r.done) : false;
      var h='<div class="item'+(done?" done":"")+'">';
      if(editable){
        h+='<button class="cbox'+(done?" on":"")+'" data-act="toggle" data-p="'+esc(person)+
           '" data-item="'+it.id+'" aria-label="Mark done">'+(done?"\u2713":"")+"</button>";
      }
      h+='<div class="main"><span class="name">'+esc(it.name)+'</span>'+
         '<span class="badge">'+badgeFor(it)+'</span>'+
         '<div class="desc">'+esc(it.desc)+"</div></div>";
      if(it.target){
        if(editable){
          h+='<div class="counter">'+
             '<button data-act="dec" data-p="'+esc(person)+'" data-item="'+it.id+'" aria-label="Decrease">\u2212</button>'+
             '<span class="val">'+count+' <small>/ '+it.target+"</small></span>"+
             '<button data-act="inc" data-p="'+esc(person)+'" data-item="'+it.id+'" aria-label="Increase">+</button>';
          if(it.target>=100){
            h+='<span class="quick"><button data-act="incby" data-n="10" data-p="'+esc(person)+'" data-item="'+it.id+'">+10</button>'+
               '<button data-act="incby" data-n="100" data-p="'+esc(person)+'" data-item="'+it.id+'">+100</button>'+
               (it.target>=10000?'<button data-act="incby" data-n="1000" data-p="'+esc(person)+'" data-item="'+it.id+'">+1000</button>':"")+'</span>';
          }
          h+="</div>";
        }else{
          h+='<span class="ro-mark">'+(done?'<span class="done-mark">\u2713</span> ':'')+
             '<span class="cnt">'+count+" / "+it.target+"</span></span>";
        }
      }else if(!editable){
        h+='<span class="ro-mark">'+(done?'<span class="done-mark">\u2713 Done</span>':'<span class="notdone">Not done</span>')+"</span>";
      }
      h+="</div>";
      return h;
    }
    function personView(){
      var p=state.personView||state.me, d=state.selDate;
      var editable=canEdit(p);
      var h=dateNav();
      h+="<h2 class=\"sec\">"+esc(p)+"</h2>";
      h+='<p class="note" style="margin-top:-4px;">'+(state.lastUpdated[p]?"Last updated "+fmtTime(state.lastUpdated[p]):"No entries yet")+
         (editable?"":" \u00b7 Read-only")+"</p>";
      h+="<h2 class=\"sec\">Last 7 days</h2>";
      h+='<div class="strip">';
      for(var i=6;i>=0;i--){
        var dd=addDays(d,-i), m=cellMark(p,dd);
        h+='<div class="'+(dstr(dd)===dstr(d)?"sel":"")+'"><span class="d">'+DOW_S[(dd.getDay()+6)%7]+" "+dd.getDate()+
           '</span><span class="'+m.cls+'">'+(m.txt||"\u00b7")+"</span></div>";
      }
      h+="</div>";
      h+="<h2 class=\"sec\">Checklist \u2014 "+fmtDate(d)+"</h2>";
      h+=checklistView(p,d,editable);
      return h;
    }

    /* --- Week --- */
    function weekView(){
      var ws=state.weekStart;
      var h='<div class="datenav"><button data-act="prev-week" aria-label="Previous week">\u2190</button>'+
        '<span class="date">Week of '+ws.getDate()+" "+MON_S[ws.getMonth()]+"</span>"+
        '<button data-act="next-week" aria-label="Next week">\u2192</button>'+
        '<span class="sub">'+fmtDate(ws)+" \u2013 "+fmtDate(addDays(ws,6))+"</span></div>";
      h+='<div class="tablebox"><table class="ledger"><thead><tr><th class="person">Person</th>';
      for(var i=0;i<7;i++){ var dd=addDays(ws,i);
        h+="<th>"+DOW_S[i]+"<br>"+dd.getDate()+"</th>"; }
      h+='<th class="pct">Week</th></tr></thead><tbody>';
      PEOPLE.forEach(function(p){
        var totFrac=0;
        h+='<tr class="'+(p===state.me?"me-row":"")+'"><td class="person">'+
           '<button class="namelink" data-act="open-person" data-p="'+esc(p)+'">'+esc(p)+"</button></td>";
        for(var i=0;i<7;i++){ var d2=addDays(ws,i), m=cellMark(p,d2);
          totFrac+=dayStats(p,d2).frac;
          h+='<td><span class="'+m.cls+'">'+m.txt+"</span></td>"; }
        h+='<td class="pct">'+Math.round(totFrac/7*100)+"%</td></tr>";
      });
      h+="</tbody></table></div>";
      h+='<p class="note">\u2713 = all items done that day. A fraction such as 9/17 = items done out of items due. \u2014 in red = a past day with nothing recorded.</p>';
      h+='<p><button class="primary" data-act="export-xlsx">Export this week to Excel</button></p>';
      return h;
    }
    function exportView(){
      return "<h2 class=\"sec\">Export</h2>"+
        '<div class="empty" style="color:var(--ink);">Downloads the weekly table (persons \u00d7 days, with the weekly percentage) '+
        "for the week of "+fmtDate(state.weekStart)+' as an Excel file.<br><br>'+
        '<button class="primary" data-act="export-xlsx">Export weekly table to Excel</button></div>';
    }
    function doExport(){
      var ws=state.weekStart;
      var head=["Person"]; var i,dd;
      for(i=0;i<7;i++){ dd=addDays(ws,i); head.push(DOW_S[i]+" "+dd.getDate()+" "+MON_S[dd.getMonth()]); }
      head.push("Weekly %");
      var rows=[head];
      PEOPLE.forEach(function(p){
        var row=[p], tot=0;
        for(var i=0;i<7;i++){ var d2=addDays(ws,i), m=cellMark(p,d2);
          tot+=dayStats(p,d2).frac;
          row.push(m.txt===""?"":(m.cls==="missed"?"missed":m.txt)); }
        row.push(Math.round(tot/7*100)+"%");
        rows.push(row);
      });
      var fname="daily-ibadah-week-"+dstr(ws)+".xlsx";
      if(window.XLSX){
        var wsx=XLSX.utils.aoa_to_sheet(rows);
        var wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,wsx,"Week");
        XLSX.writeFile(wb,fname);
      }else{
        var csv=rows.map(function(r){return r.map(function(c){
          return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
        var a=document.createElement("a");
        a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
        a.download=fname.replace(".xlsx",".csv"); a.click();
        setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
      }
    }

    /* --- Admin panel --- */
    function adminPanel(){
      if(state.me!==ADMIN_PERSON) return "";
      return '<div class="modal"><h3>Admin \u2014 '+esc(ADMIN_PERSON)+'</h3>'+
        (state.admin
          ? '<p class="note" style="margin:0 0 8px;">Admin mode is on for '+esc(ADMIN_PERSON)+', the only admin. Open any person and any day: edits you make to someone else\u2019s checklist are saved as corrections and recorded in the activity feed.</p>'+
            '<div class="rowflex"><button data-act="admin-off">Turn admin off</button></div>'
          : '<p class="note" style="margin:0 0 8px;">Admin is reserved for '+esc(ADMIN_PERSON)+' only. Enter the admin PIN to correct a past entry. If no admin PIN has been set yet, the PIN you enter becomes the admin PIN.</p>'+
            '<form id="admin-form" class="rowflex"><input name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4-digit PIN" autocomplete="off" style="width:150px;">'+
            '<button class="primary" type="submit">Continue</button></form>')+
        '<div class="err" id="admin-err"></div></div>';
    }

    /* --- Identity setup --- */
    function setupView(){
      var h='<div class="setup"><h1>Daily Ibadah Tracker</h1>'+
        "<p>Choose your name and enter your 4-digit PIN. If this is your first time, the PIN you enter becomes your PIN for this name. The device remembers you; the checklist itself is stored in the shared database.</p>"+
        '<div class="namelist">';
      PEOPLE.forEach(function(p){
        h+='<button data-act="pick-name" data-p="'+esc(p)+'" class="'+(state.setupName===p?"sel":"")+'">'+esc(p)+"</button>";
      });
      h+='</div><form id="setup-form"><div class="pinrow">'+
         '<input id="setup-pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="PIN" autocomplete="off">'+
         '<button class="primary" type="submit">Continue</button></div>'+
         '<div class="err">'+esc(state.setupMsg)+"</div></form></div>";
      return h;
    }

    /* ============ Events ============ */
    document.addEventListener("click",function(e){
      var el=e.target.closest("[data-act]"); if(!el) return;
      var act=el.getAttribute("data-act");
      if(act==="reload"){ location.reload(); }
      else if(act==="tab"){ state.view=el.getAttribute("data-v"); state.adminPanel=false; ensureRange(state.selDate).then(render); render(); }
      else if(act==="prev-day"){ state.selDate=addDays(state.selDate,-1); ensureRange(state.selDate).then(render); render(); }
      else if(act==="next-day"){ state.selDate=addDays(state.selDate,1); ensureRange(state.selDate).then(render); render(); }
      else if(act==="goto-today"){ state.selDate=new Date(); ensureRange(state.selDate).then(render); render(); }
      else if(act==="prev-week"){ state.weekStart=addDays(state.weekStart,-7); ensureRange(state.weekStart).then(render); render(); }
      else if(act==="next-week"){ state.weekStart=addDays(state.weekStart,7); ensureRange(state.weekStart).then(render); render(); }
      else if(act==="open-person"){ state.personView=el.getAttribute("data-p"); state.view="person"; render(); }
      else if(act==="pick-name"){ state.setupName=el.getAttribute("data-p"); state.setupMsg=""; render(); var inp=document.getElementById("setup-pin"); if(inp) inp.focus(); }
      else if(act==="switch"){ try{localStorage.removeItem("ibadah-identity");}catch(err){}
        state.me=null; state.admin=false; state.setupName=null; state.setupMsg=""; render(); }
      else if(act==="admin"){ if(state.me!==ADMIN_PERSON){ state.admin=false; state.adminPanel=false; render(); return; } state.adminPanel=!state.adminPanel; render(); }
      else if(act==="admin-off"){ state.admin=false; state.adminPanel=false; render(); }
      else if(act==="export-xlsx"){ doExport(); }
      else if(act==="toggle"||act==="inc"||act==="dec"||act==="incby"){
        var person=el.getAttribute("data-p"), item=ITEM_BY_ID[el.getAttribute("data-item")];
        if(!item || !canEdit(person)) return;
        var ds=dstr(state.selDate), r=getCI(person,ds,item.id);
        var count=r?(r.count||0):0, done=r?!!r.done:false;
        if(act==="toggle"){ if(item.target){ setCheck(person,ds,item, !done, done?0:item.target); }
          else setCheck(person,ds,item,!done,0); }
        else if(act==="inc") setCheck(person,ds,item,false,count+1);
        else if(act==="dec") setCheck(person,ds,item,false,count-1);
        else if(act==="incby") setCheck(person,ds,item,false,count+parseInt(el.getAttribute("data-n"),10));
      }
    });
    document.addEventListener("submit",function(e){
      if(e.target.id==="setup-form"){
        e.preventDefault();
        var pin=(document.getElementById("setup-pin").value||"").trim();
        if(!state.setupName){ state.setupMsg="Choose your name first."; render(); return; }
        if(!/^\d{4}$/.test(pin)){ state.setupMsg="Enter a 4-digit PIN."; render(); return; }
        var person=state.setupName;
        pinHash(person,pin).then(function(hash){
          return sb.from("identities").select("person,pin_hash").eq("person",person).maybeSingle()
          .then(function(res){
            if(res.error){ noteError(res.error); if(!state.setupError){ state.setupMsg="Could not check the PIN. Try again."; render(); } return; }
            if(res.data){
              if(res.data.pin_hash!==hash){ state.setupMsg="That PIN does not match the PIN set for "+person+"."; render(); return; }
              finishSetup(person);
            }else{
              sb.from("identities").insert({person:person,pin_hash:hash}).then(function(r2){
                if(r2.error){ noteError(r2.error); state.setupMsg="Could not save the PIN. Try again."; render(); return; }
                finishSetup(person);
              });
            }
          });
        });
      }
      if(e.target.id==="admin-form"){
        e.preventDefault();
        if(state.me!==ADMIN_PERSON){ state.admin=false; state.adminPanel=false; render(); return; }
        var pin=(e.target.querySelector("input[name=pin]").value||"").trim();
        var errEl=document.getElementById("admin-err");
        if(!/^\d{4}$/.test(pin)){ errEl.textContent="Enter a 4-digit PIN."; return; }
        pinHash("admin",pin).then(function(hash){
          sb.from("settings").select("key,value").eq("key","admin_pin_hash").maybeSingle()
          .then(function(res){
            if(res.error){ noteError(res.error); errEl.textContent="Could not check the admin PIN."; return; }
            if(res.data){
              if(res.data.value!==hash){ errEl.textContent="That is not the admin PIN."; return; }
              state.admin=true; render();
            }else{
              sb.from("settings").insert({key:"admin_pin_hash",value:hash}).then(function(r2){
                if(r2.error){ errEl.textContent="Could not save the admin PIN."; return; }
                state.admin=true; render();
              });
            }
          });
        });
      }
    });
    function finishSetup(person){
      state.me=person;
      if(person!==ADMIN_PERSON){ state.admin=false; state.adminPanel=false; }
      try{ localStorage.setItem("ibadah-identity", JSON.stringify({person:person})); }catch(e){}
      state.view="today"; state.setupMsg="";
      ensureRange(new Date()).then(render); render();
    }
    window.addEventListener("online",function(){ state.online=true; flushQueue(); render(); });
    window.addEventListener("offline",function(){ state.online=false; render(); });

    /* ============ Boot ============ */
    function boot(){
      if(!window.supabase || !window.supabase.createClient){
        state.bootError="The Supabase library could not be loaded. Check your connection and try again.";
        render(); return;
      }
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      /* Probe the tables so a missing setup shows a clear error, not fake data. */
      sb.from("identities").select("person").limit(1).then(function(res){
        if(res.error){ noteError(res.error);
          if(!state.setupError){ state.bootError="Could not reach the database: "+(res.error.message||"unknown error"); }
          render(); return; }
        ensureRange(new Date()).then(function(){
          render();
          /* Realtime: other people's updates appear without a refresh. */
          try{
            sb.channel("ibadah-live")
              .on("postgres_changes",{event:"*",schema:"public",table:"checkins"},function(payload){
                if(payload.new && payload.new.person) mergeRow(payload.new);
                render();
              })
              .on("postgres_changes",{event:"*",schema:"public",table:"activity"},function(){
                loadActivity().then(render);
              })
              .subscribe();
          }catch(e){}
          /* Fallback refresh in case Realtime is not enabled on the project. */
          setInterval(function(){ if(state.me && !state.setupError){ ensureRange(state.selDate).then(render); } }, 25000);
        });
      }).catch(function(){
        state.online = navigator.onLine;
        state.bootError = state.online ? "Could not reach the database." :
          "You are offline. The tracker needs a connection for the first load.";
        render();
      });
    }
    boot();
    </script>
