<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#00262B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="data:," />
    <title>Daily Ibadah Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
      /* Northpoint-style look: Jet Black #00262B, Light Cyan #CDE3E6,
         Light Green #ABFFAE. Clean and minimal — flat rectangular buttons,
         thin borders, generous spacing, no shadows, no gradients.
         Layout still sized for iPhone 14 Pro: 393x852 CSS px, Dynamic Island
         top inset + home-indicator bottom inset via env(). */
      :root{
        --bg:#FFFFFF; --paper:#FFFFFF; --ink:#00262B; --muted:#527075;
        --dark:#00262B; --cyan:#CDE3E6; --cyan-soft:#EFF6F7; --green:#ABFFAE; --green-soft:#EBFFEC;
        --line:#00262B; --line-soft:#CDE3E6;
        --accent:#00262B; --accent-soft:#CDE3E6;
        --red:#B3261E; --amber-bg:#EFF6F7;
        --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
        --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
        color-scheme:light;
      }
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
      html{-webkit-text-size-adjust:100%;}
      body{margin:0;background:var(--bg);color:var(--ink);
        font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        font-size:17px;line-height:1.5;font-variant-numeric:tabular-nums;
        padding-left:var(--sal);padding-right:var(--sar);}
      button,[role="button"],select,input{min-height:44px;touch-action:manipulation;}
      button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);
        border-radius:0;padding:.5rem .85rem;cursor:pointer;font-weight:600;}
      button:active{background:var(--cyan);}
      button.primary{background:var(--green);border-color:var(--green);color:var(--dark);font-weight:700;
        min-height:58px;border-radius:0;font-size:17px;width:100%;}
      button.primary:active{background:var(--cyan);}
      button.continue-btn{background:var(--dark);border:1px solid var(--dark);color:#fff;font-weight:700;
        min-height:60px;border-radius:10px;font-size:1.05rem;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;}
      button.continue-btn:active{background:#00414A;}
      form .continue-btn{flex:1 1 auto;min-width:170px;width:auto;}
      .pinrow .continue-btn{flex:none;width:100%;}
      button:disabled{opacity:.45;cursor:default;}
      input,select{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);
        border-radius:0;padding:.55rem .7rem;}
      a{color:var(--dark);font-weight:600;}
      /* Content column sized for 393px: full-bleed on phone, centred wider on desktop.
         Bottom padding clears the fixed tab bar + home indicator. */
      .wrap{max-width:560px;margin:0 auto;padding:0 20px calc(104px + var(--sab));width:100%;}
      @media(min-width:700px){.wrap{max-width:860px;}}

      /* Sticky header: dark Jet Black bar below the Dynamic Island */
      .topbar{border-bottom:1px solid var(--dark);background:var(--dark);color:#fff;
        position:sticky;top:0;z-index:40;padding-top:var(--sat);}
      .topbar-in{max-width:860px;margin:0 auto;padding:10px 20px;display:flex;gap:12px;align-items:center;min-height:60px;}
      .avatar{width:40px;height:40px;border-radius:0;background:var(--green);color:var(--dark);
        display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:none;}
      .topbar .avatar{background:var(--green);color:var(--dark);}
      .who{line-height:1.2;min-width:0;}
      .who small{display:block;font-size:.72rem;color:var(--cyan);font-weight:600;letter-spacing:.05em;text-transform:uppercase;}
      .who strong{display:block;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;}
      .topbar .spacer{flex:1;}
      .topbar button{font-size:.92rem;font-weight:600;padding:.3rem .75rem;min-height:44px;white-space:nowrap;
        background:transparent;color:#fff;border-color:var(--cyan);}
      .topbar button:active{background:var(--cyan);color:var(--dark);}
      .topbar button.admin-on,.admin-on{background:var(--green);color:var(--dark);border-color:var(--green);font-weight:700;}

      /* Sticky bottom navigation — thumb reach, one-handed, above home indicator */
      .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);
        border-top:1px solid var(--dark);padding:4px 8px calc(4px + var(--sab));}
      .tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;}
      .tabbar button{background:transparent;border:none;border-radius:0;min-height:56px;
        padding:5px 2px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:3px;color:var(--muted);font-size:.72rem;font-weight:600;line-height:1;}
      .tabbar button svg{width:25px;height:25px;display:block;}
      .tabbar button.active{color:var(--dark);background:var(--cyan);}
      .tabbar button:active{background:var(--cyan);}

      /* Date navigator — 44pt step targets, large centred date */
      .datenav{display:flex;align-items:flex-start;gap:8px;padding:18px 0 4px;}
      .datenav .navbtn{width:44px;height:44px;min-height:44px;border-radius:0;background:var(--paper);
        border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
        font-size:1.35rem;line-height:1;flex:none;padding:0;}
      .datenav .center{flex:1;text-align:center;min-width:0;}
      .datenav .date{display:block;font-size:1.6rem;font-weight:700;line-height:1.15;}
      .datenav .sub{display:block;color:var(--muted);font-size:.9rem;margin-top:2px;}
      .datenav .today-pill{margin-top:8px;min-height:44px;padding:0 16px;border-radius:0;
        background:var(--cyan);color:var(--dark);font-weight:700;font-size:.9rem;border:1px solid var(--dark);}

      h2.sec{font-size:1.3rem;margin:26px 0 10px;font-weight:700;line-height:1.25;}
      .note{color:var(--muted);font-size:.9rem;line-height:1.55;}
      .empty{border:1px solid var(--line-soft);background:var(--cyan-soft);padding:18px;border-radius:0;color:var(--muted);font-size:.95rem;}
      .banner{border:1px solid var(--red);background:var(--paper);
        padding:14px 16px;margin:16px 0;border-radius:0;font-size:.95rem;}
      .banner.offline{border-color:var(--dark);background:var(--cyan-soft);}
      .banner.ok{border-color:var(--dark);}
      .banner h2{margin:0 0 6px;font-size:1.15rem;}
      .banner p{margin:4px 0;}
      .banner code{background:var(--cyan-soft);border:1px solid var(--line-soft);padding:0 4px;border-radius:0;font-size:.85em;}
      .banner button{min-height:44px;}

      /* Today / Week — person cards */
      .pcard,.wcard{background:var(--paper);border:1px solid var(--line);border-radius:0;padding:16px 14px;margin-bottom:12px;}
      .pcard-head{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
        padding:0;min-height:48px;text-align:left;border-radius:0;}
      .pcard-head:active{background:none;opacity:.75;}
      .pcard .avatar,.wcard .avatar{width:44px;height:44px;font-size:1.1rem;}
      .pcard-meta{flex:1;min-width:0;}
      .pcard-meta b{display:block;font-size:1.05rem;line-height:1.25;}
      .pcard-meta span{display:block;font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .pct-pill{flex:none;font-size:.92rem;font-weight:700;background:var(--cyan);color:var(--dark);
        border:1px solid var(--dark);padding:5px 9px;border-radius:0;min-width:54px;text-align:center;}
      .pct-pill.low{background:var(--paper);color:var(--muted);}
      .progress{height:8px;background:var(--cyan);border-radius:0;overflow:hidden;margin:12px 0 10px;}
      .progress i{display:block;height:100%;background:var(--dark);}
      .chips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
      @media(min-width:480px){.chips{grid-template-columns:repeat(7,1fr);}}
      @media(min-width:700px){.chips{grid-template-columns:repeat(14,1fr);}}
      .chip{border-radius:0;background:var(--cyan-soft);border:1px solid var(--line-soft);padding:6px 1px 5px;text-align:center;line-height:1.15;min-height:44px;}
      .chip b{display:block;font-size:.7rem;}
      .chip span{display:block;font-size:.78rem;margin-top:2px;}
      .chip.done{background:var(--green-soft);border-color:var(--dark);}
      .chip.done span{color:var(--dark);font-weight:700;}
      .chip.part span{font-size:.68rem;font-weight:600;}
      .legend{font-size:.82rem;color:var(--muted);margin-top:8px;line-height:1.6;}
      .legend b{color:var(--ink);font-weight:700;}
      .cta{margin:18px 0 4px;}
      .wgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;}
      .wcell{text-align:center;background:var(--cyan-soft);border:1px solid var(--line-soft);border-radius:0;padding:6px 1px;line-height:1.2;min-height:44px;}
      .wcell b{display:block;font-size:.66rem;color:var(--muted);font-weight:600;}
      .wcell span{display:block;font-size:.85rem;margin-top:2px;font-weight:600;}
      .done-mark{color:var(--dark);font-weight:700;}
      .partial{font-size:.7rem !important;}
      .missed{color:var(--red);}

      /* Checklist — tall, thumb-friendly rows */
      .group-head{font-size:1rem;font-weight:700;margin:24px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--dark);}
      .item{border:1px solid var(--line);background:var(--paper);border-radius:0;
        padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;min-height:72px;}
      .item.done{background:var(--green-soft);}
      .item .main{flex:1;min-width:0;padding-top:4px;}
      .item .name{font-weight:700;font-size:1.02rem;line-height:1.3;}
      .item .desc{color:var(--muted);font-size:.88rem;margin-top:2px;line-height:1.45;}
      .badge{display:inline-block;font-size:.72rem;font-weight:700;color:var(--dark);
        border:1px solid var(--dark);border-radius:0;padding:0 5px;margin-left:6px;vertical-align:2px;white-space:nowrap;background:var(--cyan);}
      .badge.grey{color:var(--muted);border-color:var(--line-soft);background:var(--paper);}
      .cbox{flex:none;width:44px;height:44px;min-height:44px;border:2px solid var(--dark);
        border-radius:0;background:var(--paper);font-size:1.35rem;line-height:1;padding:0;
        color:var(--dark);display:flex;align-items:center;justify-content:center;}
      .cbox.on{border-color:var(--dark);background:var(--green);}
      .cbox:disabled{opacity:.5;}
      .counter{flex:none;display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:158px;}
      .counter button{width:44px;height:44px;min-height:44px;font-size:1.2rem;padding:0;}
      .counter .val{font-weight:700;font-size:1.02rem;min-width:62px;text-align:center;line-height:1.15;}
      .counter .val small{display:block;color:var(--muted);font-weight:400;font-size:.72rem;}
      .quick{display:flex;gap:6px;width:100%;justify-content:flex-end;margin-top:6px;}
      .quick button{width:auto;height:44px;min-height:44px;font-size:.85rem;font-weight:600;padding:0 12px;}
      .ro-mark{flex:none;font-weight:700;color:var(--dark);font-size:.95rem;padding-top:8px;text-align:right;}
      /* Juz picker (Günlük Hatmi Quran only) — manual per person, per day */
      .juzpick{flex:none;display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);font-weight:600;padding-top:2px;}
      .juzpick select{min-height:44px;font-size:1rem;font-weight:700;color:var(--ink);padding:.3rem .45rem;max-width:118px;}
      .ro-mark .cnt{color:var(--ink);font-weight:600;display:block;}
      .ro-mark .notdone{color:var(--muted);font-weight:400;font-size:.88rem;}

      /* Activity feed — flat list */
      .feed{border:1px solid var(--line);background:var(--paper);border-radius:0;overflow:hidden;}
      .feed>div{padding:11px 14px;border-bottom:1px solid var(--line-soft);font-size:.94rem;line-height:1.45;display:flex;gap:8px;align-items:flex-start;}
      .feed>div:last-child{border-bottom:none;}
      .feed .fdot{width:8px;height:8px;border-radius:0;background:var(--dark);flex:none;margin-top:7px;}
      .feed .t{color:var(--muted);font-size:.84rem;white-space:nowrap;}

      /* Setup / PIN — full-height on 393x852, big targets, no zoom on focus (16px+ input) */
      .setup{max-width:430px;margin:0 auto;padding:calc(28px + var(--sat)) 24px calc(28px + var(--sab));min-height:100dvh;display:flex;flex-direction:column;}
      .setup .setup-brand{margin-bottom:22px;text-align:left;font-size:1.9rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--dark);line-height:1.1;}
      .setup h1{font-size:2rem;line-height:1.15;margin:0 0 10px;font-weight:700;}
      .setup p{color:var(--muted);margin:0 0 22px;font-size:1rem;line-height:1.55;}
      .namelist{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
      .namelist button{text-align:left;padding:0 1rem;min-height:58px;font-size:1.08rem;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--dark);border-radius:0;background:var(--paper);}
      .namelist button.sel{border-color:var(--dark);background:var(--cyan);font-weight:700;}
      .namelist button.sel::after{content:"\u2713";color:var(--dark);font-weight:700;}
      .pinrow{display:flex;flex-direction:column;gap:12px;}
      .pinrow input{flex:1;font-size:1.35rem;letter-spacing:.4em;text-align:center;min-height:60px;font-weight:700;padding-left:22px;}
      .err{color:var(--red);font-size:.92rem;margin-top:10px;min-height:1.2em;text-align:center;}

      /* 7-day strip (person view) */
      .strip{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);background:var(--paper);border-radius:0;overflow:hidden;}
      .strip>div{padding:8px 1px;text-align:center;border-right:1px solid var(--line-soft);font-size:.88rem;font-weight:600;min-height:52px;}
      .strip>div:last-child{border-right:none;}
      .strip .d{display:block;color:var(--muted);font-size:.7rem;margin-bottom:2px;}
      .strip .sel{background:var(--cyan);}

      .modal{border:1px solid var(--line);background:var(--cyan-soft);border-radius:0;padding:16px;margin:16px 0;}
      .modal h3{margin:0 0 8px;font-size:1.1rem;}
      .modal input{min-height:52px;font-size:1rem;}
      .modal button{min-height:48px;}
      .modal .primary{flex:1;width:auto;}
      .rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
      .loading{padding:60px 0;text-align:center;color:var(--muted);}

      /* Tables — Today & Week: flat 1px rules, dark header.
         The table scrolls horizontally ONLY inside .tablebox (page itself
         never scrolls sideways); first column (person) stays sticky. */
      .tablebox{border:1px solid var(--line);background:var(--paper);border-radius:0;
        overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;max-width:100%;margin-bottom:12px;}
      .tablebox:focus-visible{outline:2px solid var(--dark);outline-offset:2px;}
      table.ledger{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;}
      table.ledger th,table.ledger td{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);
        padding:7px 4px;text-align:center;font-size:.84rem;line-height:1.25;min-width:38px;height:48px;vertical-align:middle;background:var(--paper);}
      table.ledger tr:last-child td{border-bottom:none;}
      table.ledger th:last-child,table.ledger td:last-child{border-right:none;}
      table.ledger thead th{background:var(--dark);color:#fff;font-size:.72rem;font-weight:700;
        letter-spacing:.02em;padding:8px 4px;height:auto;white-space:nowrap;}
      table.ledger thead th small{display:block;font-weight:400;font-size:.68rem;opacity:.85;letter-spacing:0;}
      table.ledger td.done-cell{background:var(--green-soft);}
      table.ledger td.total,table.ledger th.total{min-width:58px;background:var(--cyan);font-weight:700;color:var(--dark);}
      table.ledger thead th.total{background:var(--dark);color:#fff;}
      table.ledger th.person,table.ledger td.person{position:sticky;left:0;text-align:left;
        min-width:118px;max-width:132px;width:118px;padding:6px 8px;border-right:1px solid var(--line);}
      table.ledger td.person{background:var(--paper);z-index:2;}
      table.ledger thead th.person{background:var(--dark);color:#fff;z-index:3;}
      .person-btn{display:block;width:100%;background:none;border:none;border-radius:0;padding:0;min-height:0;
        text-align:left;font-weight:700;font-size:.92rem;line-height:1.2;color:var(--ink);cursor:pointer;white-space:normal;}
      .person-btn:active{background:none;color:var(--dark);}
      .person-sub{display:block;font-size:.7rem;color:var(--muted);font-weight:400;line-height:1.25;margin-top:2px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .total-sub{display:block;font-size:.7rem;font-weight:400;color:var(--muted);margin-top:1px;}
      table.ledger td.total .total-sub{color:var(--muted);}
      .scroll-hint{font-size:.8rem;color:var(--muted);margin:-4px 0 10px;line-height:1.4;}

      /* Today vs Week — distinct headers + per-person done / not-done status */
      .viewtag{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
        padding:4px 10px;border-radius:0;}
      .viewtag.today{background:var(--dark);color:#fff;}
      .viewtag.week{background:var(--cyan);color:var(--dark);border:1px solid var(--dark);}
      .statusbox{border:1px solid var(--line);background:var(--paper);border-radius:0;overflow:hidden;margin-bottom:6px;}
      .status-row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;
        border-bottom:1px solid var(--line-soft);padding:11px 14px;min-height:56px;text-align:left;border-radius:0;}
      .status-row:last-child{border-bottom:none;}
      button.status-row:active{background:var(--cyan);}
      .status-row .avatar{width:38px;height:38px;font-size:.95rem;flex:none;}
      .status-name{flex:1;min-width:0;font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .status-name small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;white-space:normal;}
      .status-pill{flex:none;font-size:.82rem;font-weight:700;padding:5px 9px;border-radius:0;border:1px solid var(--dark);text-align:center;}
      .status-pill.done{background:var(--green);border-color:var(--dark);color:var(--dark);}
      .status-pill.part{background:var(--cyan);color:var(--dark);}
      .status-pill.none{background:var(--paper);color:var(--muted);border-color:var(--line-soft);}
      .status-pill.missed{background:var(--paper);color:var(--red);border-color:var(--red);}
      .tabbar-in.cols3{grid-template-columns:repeat(3,1fr);}
      .namelist .sub{display:block;font-size:.8rem;color:var(--muted);font-weight:400;margin-top:1px;}
      @media (prefers-reduced-motion: reduce){*{scroll-behavior:auto !important;}}

      /* ===== "loading" loader — Uiverse.io by andrew-manzyk =====
         9 clipped slices of the word "loading", scrolling spans, and a
         wobbling line underneath. Used only on the dark 2-second loading
         screen, big and white — no FAYSALABAD text on that screen. The
         name-picker / login screen shows FAYSALABAD as plain text instead
         (see .setup-brand above) — no loader classes, no scrolling, no
         wobble line there.
         The base size (4em) makes the loader ~496px wide, wider than
         the iPhone 14 Pro screen, so the loading placement scales it down
         with a transform; its layout box is contained by the
         overflow:hidden loadscreen. */
      .loadscreen{position:fixed;inset:0;z-index:100;background:var(--dark);
        display:flex;align-items:center;justify-content:center;overflow:hidden;
        padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab));}
      .loadscreen .loader{transform:scale(.66);flex:none;}
      .loader {
        --main-size: 4em;
        --text-color: #ffffff;
        --shine-color: #ffffff40;
        --shadow-color: #aaaaaa;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        user-select: none;
        position: relative;
        font-size: var(--main-size);
        font-weight: 900;
        text-transform: uppercase;
        color: var(--text-color);
        width: 7.3em;
        height: 1em;
        filter: drop-shadow(0 0 0.05em var(--shine-color));
      }
      .loader .text {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        position: absolute;
      }
      .loader .text:nth-child(1) {
        clip-path: polygon(0% 0%, 11.11% 0%, 11.11% 100%, 0% 100%);
        font-size: calc(var(--main-size) / 20);
        margin-left: -2.1em;
        opacity: 0.6;
      }
      .loader .text:nth-child(2) {
        clip-path: polygon(11.11% 0%, 22.22% 0%, 22.22% 100%, 11.11% 100%);
        font-size: calc(var(--main-size) / 16);
        margin-left: -0.98em;
        opacity: 0.7;
      }
      .loader .text:nth-child(3) {

    /* ============ Items ============ */
    /* due: "daily" | "week" (any day this week) | "fri" | "sat-sun" | "month" | "first-wed" | "month-tue" (Tuesdays, once a month) */
    var ITEMS = [
      {id:"cunnetul",    code:"CE", group:"Daily", name:"Cünnet-ül Esma, 19x", desc:"Cunnet-ul Esma, 19 times, every day, alone (münferiden).", target:19, due:"daily"},
      {id:"hacet",       code:"HC", group:"Weekly", name:"Hacet Namazı, 12 rakat", desc:"Prayer of need, 12 rakats, once a week on a Saturday or Sunday evening. In each rakat: 7 Fatiha, 7 Ayetül Kürsi, 7 Kafirun, 5 İhlas, 5 Felak, 5 Nas.", due:"sat-sun"},
      {id:"fatir",       code:"FT", group:"Monthly", name:"Fatir Suresi 41. Ayet, 400x", desc:"Verse 41 of Surah Fatir, 400 times, once a month on a Tuesday, alone (münferiden).", target:400, due:"month-tue", badge:"Monthly \u00b7 Tuesday"},
      {id:"gunlukhatmi", code:"KH", group:"Daily", name:"Günlük Hatmi Quran (Kuran-ı Kerim Hatmi)", desc:"Daily Quran hatmi \u2014 mark done for the day and choose the juz reached that day (1\u201330).", due:"daily", juz:true}
    ];
    var ITEM_BY_ID = {};

    function isDue(item, date){
      var dow = date.getDay();
      switch(item.due){
        case "daily": return true;
        case "week": return true;
        case "month": return true;
        case "fri": return dow===5;
        case "sat-sun": return dow===0 || dow===6;
        case "first-wed": return dow===3 && date.getDate()<=7;
        case "month-tue": return dow===2;
      }
      return true;
    }
    function dueItems(date){ return ITEMS.filter(function(it){ return isDue(it,date); }); }
    function badgeFor(item){
      if(item.due==="daily"||item.due==="fri"||item.due==="sat-sun"||item.due==="first-wed") return "Due today";
      return item.badge || "Due today";
    }

    /* ============ Date helpers (local time) ============ */
    function pad(n){ return (n<10?"0":"")+n; }
    function dstr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
    function parseD(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
    function addDays(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
    function mondayOf(d){ var x=addDays(d,0); var dow=(x.getDay()+6)%7; return addDays(x,-dow); }
    var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
    var MON_S=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var DOW_S=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    function fmtDate(d){ return DOW_S[(d.getDay()+6)%7]+", "+d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }
    function fmtTime(iso){
      var d=new Date(iso); if(isNaN(d)) return "";
      var t=pad(d.getHours())+":"+pad(d.getMinutes());
      var today=new Date();
      if(dstr(d)===dstr(today)) return t;
      return d.getDate()+" "+MON_S[d.getMonth()]+", "+t;
    }
    function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

    /* ============ State ============ */
    var sb = null;
    var state = {
      me: null, admin:false, adminPanel:false,
      view:"today",            /* today | mine | person | week | export */
      personView:null,
      selDate:new Date(),
      weekStart:mondayOf(new Date()),
      checkins:{},             /* key person|date|itemId -> row */
      activity:[],
      lastUpdated:{},          /* person -> iso */
      queue:[],                /* offline write ops */
      online: navigator.onLine,
      setupError:null,         /* string when tables missing */
      bootError:null,
      setupName:null, setupMsg:"",
      loaderDone:false         /* 2-second "loading" loading screen seen */
    };
    function key(person,date,itemId){ return person+"|"+date+"|"+itemId; }
    function getCI(person,date,itemId){ return state.checkins[key(person,date,itemId)] || null; }

    try{
      var saved = localStorage.getItem("ibadah-identity");
      if(saved){ var p=JSON.parse(saved); if(PEOPLE.indexOf(p.person)>=0) state.me=p.person; }
    }catch(e){}

    /* ============ PIN hashing ============ */
    function pinHash(person,pin){
      var s="ibadah:"+person+":"+pin;
      if(window.crypto && crypto.subtle && window.isSecureContext){
        return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(buf){
          return Array.prototype.map.call(new Uint8Array(buf),function(b){return pad(b.toString(16));}).join("");
        });
      }
      var h1=0xdeadbeef,h2=0x41c6ce57;
      for(var i=0;i<s.length;i++){ var ch=s.charCodeAt(i);
        h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
      h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
      h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
      return Promise.resolve((h2>>>0).toString(16)+(h1>>>0).toString(16));
    }

    <script>
    "use strict";
    /* ============ Supabase data layer ============ */
    function isMissingTable(err){
      if(!err) return false;
      var m=(err.message||"")+" "+(err.code||"");
      return /42P01|PGRST205|does not exist|Could not find the table|relation .* does not exist/i.test(m);
    }
    function noteError(err){
      if(isMissingTable(err) && !state.setupError){
        state.setupError = "The Supabase tables were not found. The database setup is not complete: " +
          "the tables checkins, activity, identities, corrections and settings must be created first " +
          "(SQL Editor in the Supabase project), with row level security policies for the anon role and " +
          "checkins and activity added to the Realtime publication. No data is shown until this is done.";
        render();
      }
    }
    function mergeRow(row){
      state.checkins[key(row.person,row.check_date,row.item_id)] = row;
      if(!state.lastUpdated[row.person] || row.updated_at > state.lastUpdated[row.person])
        state.lastUpdated[row.person] = row.updated_at;
    }
    function loadCheckins(from,to){
      var q = sb.from("checkins").select("*").gte("check_date",from).lte("check_date",to);
      /* Non-privileged members only ever fetch their own rows. */
      if(state.me && !canSeeAllTables()) q = q.eq("person", state.me);
      return q.then(function(res){
          if(res.error){ noteError(res.error); return; }
          (res.data||[]).forEach(mergeRow);
        }).catch(function(e){ /* offline: keep what we have */ });
    }
    function loadLastUpdated(){
      var q = sb.from("checkins").select("person,updated_at");
      if(state.me && !canSeeAllTables()) q = q.eq("person", state.me);
      return q.order("updated_at",{ascending:false}).limit(400)
        .then(function(res){
          if(res.error){ noteError(res.error); return; }
          (res.data||[]).forEach(function(r){
            if(!state.lastUpdated[r.person]) state.lastUpdated[r.person]=r.updated_at;
          });
        }).catch(function(){});
    }
    function loadActivity(){
      var q = sb.from("activity").select("*");
      if(state.me && !canSeeAllTables()) q = q.eq("person", state.me);
      return q.order("created_at",{ascending:false}).limit(40)
        .then(function(res){
          if(res.error){ noteError(res.error); return; }
          state.activity = res.data||[];
        }).catch(function(){});
    }
    function ensureRange(center){
      var from=dstr(addDays(center,-16)), to=dstr(addDays(center,16));
      return Promise.all([loadCheckins(from,to), loadLastUpdated(), loadActivity()]);
    }

    /* ============ Editing ============ */
    function canEdit(person){ return state.me===person || (state.admin && state.me===ADMIN_PERSON); }
    /* Table visibility: only Fikri Abi and Admin can see everyone's Today /
       Week tables. Every other member sees only their own row / status. */
    function canSeeAllTables(){ return state.me==="Fikri Abi" || state.me===ADMIN_PERSON; }
    function visibleMembers(){
      if(!state.me || canSeeAllTables()) return MEMBERS.slice();
      return MEMBERS.indexOf(state.me)>=0 ? [state.me] : MEMBERS.slice();
    }
    function canSeePerson(person){ return canSeeAllTables() || person===state.me; }
    /* Drop any already-loaded rows a non-privileged member may not see
       (e.g. fetched before sign-in, or after switching accounts). */
    function purgeHidden(){
      if(!state.me || canSeeAllTables()) return;
      Object.keys(state.checkins).forEach(function(k){
        if(state.checkins[k].person!==state.me) delete state.checkins[k]; });
      Object.keys(state.lastUpdated).forEach(function(p){
        if(p!==state.me) delete state.lastUpdated[p]; });
      state.activity = state.activity.filter(function(a){ return a.person===state.me; });
    }
    function oldValText(row,item){
      if(!row) return "not done";
      if(item.target) return (row.count||0)+"/"+item.target;
      var t = row.done ? "done" : "not done";
      if(item.juz && row.count) t += " (Juz "+row.count+")";
      return t;
    }
    function applyLocal(person,date,itemId,done,count,target){
      var k=key(person,date,itemId);
      state.checkins[k]={person:person,check_date:date,item_id:itemId,done:done,
        count:count,target:target,updated_at:new Date().toISOString()};
      state.lastUpdated[person]=state.checkins[k].updated_at;
    }
    function setCheck(person,date,item,done,count){
      var row=getCI(person,date,item.id);
      var oldText=oldValText(row,item);
      var target=item.target||null;
      if(item.target){ count=Math.max(0,Math.min(item.target,count)); done = count>=item.target; }
      else if(item.juz){ count=Math.max(0,Math.min(30,count||0)); done=!!done; }
      else { count=0; done=!!done; }
      var newText = item.target ? (count+"/"+item.target) : (done?"done":"not done");
      if(item.juz && count>0) newText += " (Juz "+count+")";
      if(oldText===newText){ render(); return; }
      applyLocal(person,date,item.id,done,count,target);
      render();

      var ops=[];
      ops.push({table:"checkins", method:"upsert", payload:{
        person:person, check_date:date, item_id:item.id, done:done, count:count,
        target:target, updated_at:new Date().toISOString()}});
      /* Activity entry */
      var action;
      if(state.admin && state.me===ADMIN_PERSON && person!==state.me){
        action="corrected";
        ops.push({table:"activity", method:"insert", payload:{
          person:state.me, item_name:item.name+" (for "+person+", "+date+")", action:"corrected"}});
        ops.push({table:"corrections", method:"insert", payload:{
          admin_person:state.me, person:person, check_date:date, item_id:item.id,
          old_value:oldText, new_value:newText}});
      }else{
        if(item.target) action = done ? "finished" : "updated";
        else action = done ? "finished" : "unchecked";
        ops.push({table:"activity", method:"insert", payload:{
          person:person, item_name:item.name, action:action}});
      }
      runOps(ops);
    }
    function runOps(ops){
      if(!state.online){ state.queue.push.apply(state.queue,ops); render(); return; }
      var chain=Promise.resolve();
      ops.forEach(function(op){
        chain=chain.then(function(){
          var q = op.method==="upsert"
            ? sb.from(op.table).upsert(op.payload,{onConflict:"person,check_date,item_id"})
            : sb.from(op.table).insert(op.payload);
          return q.then(function(res){ if(res.error) noteError(res.error); });
        }).catch(function(){
          /* network failure mid-write: queue the rest */
          state.queue.push(op);
        });
      });
      chain.then(function(){ render(); });
    }
    function flushQueue(){
      if(!state.queue.length || !state.online) return;
      var ops=state.queue.splice(0,state.queue.length);
      runOps(ops);
    }

    /* ============ Completion maths ============ */
    /* Fatir is due once a month, on a Tuesday. Returns the date (yyyy-mm-dd)
       of an earlier completed Fatir in the same month as dateObj, or null.
       Once it is done that month, later Tuesdays no longer count it as due. */
    function fatirDoneEarlier(person,dateObj){
      var ym=dstr(dateObj).slice(0,7), ds=dstr(dateObj), found=null;
      Object.keys(state.checkins).forEach(function(k){
        var r=state.checkins[k];
        if(r.person===person && r.item_id==="fatir" && r.done &&
           String(r.check_date).slice(0,7)===ym && r.check_date<ds){
          if(!found || r.check_date<found) found=r.check_date;
        }
      });
      return found;
    }
    function dayStats(person,dateObj){
      var ds=dstr(dateObj), doneN=0, frac=0;
      var items=dueItems(dateObj).filter(function(it){
        return it.id!=="fatir" || !fatirDoneEarlier(person,dateObj);
      });
      items.forEach(function(it){
        var r=getCI(person,ds,it.id);
        if(!r) return;
        if(it.target){ var f=Math.min(1,(r.count||0)/it.target); frac+=f; if(r.done||f>=1) doneN++; }
        else if(r.done){ frac+=1; doneN++; }
      });
      return {total:items.length, done:doneN, frac:items.length?frac/items.length:0};
    }
    function cellMark(person,dateObj){
      var ds=dstr(dateObj), items=dueItems(dateObj);
      var st=dayStats(person,dateObj);
      if(st.done===st.total && st.total>0) return {cls:"done-mark", txt:"\u2713"};
      if(st.frac>0) return {cls:"partial", txt:st.done+"/"+st.total};
      var today=new Date();
      if(ds<dstr(today)) return {cls:"missed", txt:"\u2014"};
      return {cls:"", txt:""};
    }
    /* Per-item mark for the Today ledger: person x item cells. */
    function itemMark(person,dateObj,item){
      var ds=dstr(dateObj), r=getCI(person,ds,item.id);
      var isPast = ds<dstr(new Date());
      if(item.juz){
        /* Günlük Hatmi Quran: done mark plus the manually entered juz. */
        if(!r) return isPast ? {cls:"missed", txt:"\u2014"} : {cls:"", txt:"\u00b7"};
        var jc=r.count||0;
        if(r.done) return {cls:"done-mark", txt:"\u2713"+(jc?" Juz "+jc:"")};
        if(jc>0) return {cls:"partial", txt:"Juz "+jc};
        return isPast ? {cls:"missed", txt:"\u2014"} : {cls:"", txt:"\u00b7"};
      }
      if(!r){
        /* Fatir already completed earlier this month: satisfied, not missed. */
        if(item.id==="fatir" && fatirDoneEarlier(person,dateObj)) return {cls:"", txt:"\u2713"};
        return isPast ? {cls:"missed", txt:"\u2014"} : {cls:"", txt:"\u00b7"};
      }
      if(item.target){
        var c=r.count||0;
        if(r.done || c>=item.target) return {cls:"done-mark", txt:"\u2713"};
        if(c>0) return {cls:"partial", txt:c+"/"+item.target};
        if(item.id==="fatir" && fatirDoneEarlier(person,dateObj)) return {cls:"", txt:"\u2713"};
        return isPast ? {cls:"missed", txt:"\u2014"} : {cls:"", txt:"\u00b7"};
      }
      if(r.done) return {cls:"done-mark", txt:"\u2713"};
      return isPast ? {cls:"missed", txt:"\u2014"} : {cls:"", txt:"\u00b7"};
    }
    /* Week cell for Günlük Hatmi Quran: the juz reached that day, as entered
       by that person. Empty / \u2014 when nothing was entered \u2014 never guessed. */
    function juzCell(person,dateObj){
      var r=getCI(person,dstr(dateObj),"gunlukhatmi");
      var isPast = dstr(dateObj)<dstr(new Date());
      if(!r) return isPast ? '<span class="missed">\u2014</span>' : "\u00b7";
      if(r.count>0) return '<span class="'+(r.done?"done-mark":"partial")+'">'+(r.done?"\u2713 ":"")+"Juz "+r.count+"</span>";
      if(r.done) return '<span class="done-mark">\u2713</span>';
      return isPast ? '<span class="missed">\u2014</span>' : "\u00b7";
    }
    function personCell(p,subText){
      return '<td class="person"><button class="person-btn" data-act="open-person" data-p="'+esc(p)+'">'+
        esc(p)+(p===state.me?" \u00b7 You":"")+'</button>'+
        (subText?'<span class="person-sub">'+esc(subText)+"</span>":"")+"</td>";
    }

    /* Has this member done the day / the week, or not? Plain status per person,
       so the Admin (and everyone) can see it without reading the table cells. */
    function dayStatus(person,dateObj){
      var st=dayStats(person,dateObj);
      if(st.total && st.frac>=1) return {cls:"done", label:"\u2713 Done", detail:st.done+"/"+st.total+" items done"};
      if(st.frac>0) return {cls:"part", label:"Started", detail:st.done+"/"+st.total+" items done so far"};
      if(dstr(dateObj)<dstr(new Date())) return {cls:"missed", label:"Not done", detail:"Nothing recorded"};
      return {cls:"none", label:"Not yet", detail:"Nothing recorded yet"};
    }
    function weekStatus(person,ws){
      var frac=0, fullDays=0, any=false, i, s;
      for(i=0;i<7;i++){ s=dayStats(person,addDays(ws,i)); frac+=s.frac; if(s.frac>0) any=true; if(s.total && s.frac>=1) fullDays++; }
      var pct=Math.round(frac/7*100);
      if(pct>=100) return {cls:"done", label:"\u2713 Done", detail:"All 7 days complete"};
      if(any) return {cls:"part", label:pct+"%", detail:fullDays+" of 7 days fully done"};
      if(dstr(addDays(ws,6))<dstr(new Date())) return {cls:"missed", label:"Not done", detail:"Nothing recorded this week"};
      return {cls:"none", label:"Not yet", detail:"Nothing recorded this week"};
    }
    function statusBox(mode, refDate){
      var h='<div class="statusbox" aria-label="'+(mode==="week"?"Who has done this week":"Who has done today")+'">';
      visibleMembers().forEach(function(p){
        var s = mode==="week" ? weekStatus(p,refDate) : dayStatus(p,refDate);
        h+='<button class="status-row" data-act="open-person" data-p="'+esc(p)+'">'+
          '<span class="avatar" aria-hidden="true">'+esc(p.charAt(0))+'</span>'+
          '<span class="status-name">'+esc(p)+(p===state.me?" \u00b7 You":"")+'<small>'+esc(s.detail)+'</small></span>'+
          '<span class="status-pill '+s.cls+'">'+esc(s.label)+'</span></button>';
      });
      return h+"</div>";
    }

    /* ============ Rendering ============ */
    var app=document.getElementById("app");
    function render(){
      /* First thing on every open: the 2-second "loading" loading screen.
         No button — after 2s the timer below flips loaderDone and the app
         continues to the name picker (or straight in, if remembered). */
      if(!state.loaderDone){ app.innerHTML = loaderView(); return; }
      if(state.setupError){ app.innerHTML = setupErrorView(); return; }
      if(state.bootError){ app.innerHTML = '<div class="wrap"><div class="banner"><h2>Could not connect</h2><p>'+
        esc(state.bootError)+'</p><p><button data-act="reload">Try again</button></p></div></div>'; return; }
      if(!state.me){ app.innerHTML = setupView(); return; }
      if(state.me!==ADMIN_PERSON){ state.admin=false; state.adminPanel=false; }
      if(state.me===ADMIN_PERSON){
        /* Admin has no checklist of its own: never land on "mine", and never
           open a person page for Admin itself. */
        if(state.view==="mine") state.view="today";
        if(state.view==="person" && state.personView===ADMIN_PERSON) state.view="today";
      }
      /* Visibility guard: only Fikri Abi and Admin may open another member's
         page. Anyone else asking for someone else's page lands on Today,
         which for them shows only their own row. */
      if(state.view==="person" && state.personView && !canSeePerson(state.personView)) state.view="today";
      var h = topbar();
      h += '<div class="wrap">';
      if(!state.online || state.queue.length) h += offlineBanner();
      if(state.adminPanel) h += adminPanel();
      if(state.view==="today") h += todayView();
      else if(state.view==="mine") h += dateNav() + "<h2 class=\"sec\">My checklist</h2>" + checklistView(state.me, state.selDate, true);
      else if(state.view==="person") h += personView();
      else if(state.view==="week") h += weekView();
      else if(state.view==="export") h += exportView();
      h += "</div>";
      h += bottomNav();
      app.innerHTML = h;
    }
    function setupErrorView(){
      return '<div class="wrap"><div class="banner"><h2>Setup is not complete</h2><p>'+
        esc(state.setupError)+'</p><p><button data-act="reload">Check again</button></p></div></div>';
    }
    function offlineBanner(){
      var msg = !state.online
        ? "You are offline. Changes are kept on this screen and sent when you are back online."
        : "Back online. Sending queued changes\u2026";
      if(state.queue.length) msg += " Queued changes: "+state.queue.length+".";
      return '<div class="banner offline">'+esc(msg)+"</div>";
    }
    function bottomNav(){
      var tabs=[
        ["today","Today",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'],
        ["mine","Checklist",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>'],
        ["week","Week",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M7 14h2M11 14h2M15 14h2"/></svg>'],
        ["export","Export",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>']
      ];
      var cur = state.view==="person" ? (state.personView===state.me?"mine":"today") : state.view;
      var isAdmin = state.me===ADMIN_PERSON;
      /* Admin oversees only: no Checklist tab, because Admin has no checklist. */
      var visible = tabs.filter(function(tb){ return !(isAdmin && tb[0]==="mine"); });
      var h='<nav class="tabbar" aria-label="Main"><div class="tabbar-in'+(isAdmin?" cols3":"")+'">';
      visible.forEach(function(tb){
        h+='<button data-act="tab" data-v="'+tb[0]+'" class="'+(cur===tb[0]?"active":"")+'" aria-current="'+(cur===tb[0]?"page":"false")+'">'+tb[2]+'<span>'+tb[1]+'</span></button>';
      });
      return h+"</div></nav>";
    }
    function topbar(){
      var initial = state.me ? esc(state.me.charAt(0)) : "?";
      var h='<div class="topbar"><div class="topbar-in">';
      h+='<span class="avatar" aria-hidden="true">'+initial+'</span>';
      h+='<span class="who"><small>Signed in as</small><strong>'+esc(state.me)+'</strong></span>';
      h+='<span class="spacer"></span>';
      if(state.me===ADMIN_PERSON) h+='<button data-act="admin" class="'+(state.admin?"admin-on":"")+'">'+(state.admin?"Admin on":"Admin")+"</button>";
      h+='<button data-act="switch">Switch</button>';
      h+="</div></div>";
      return h;
    }
    function dateNav(){
      var d=state.selDate, isToday=dstr(d)===dstr(new Date());
      var h='<div class="datenav">';
      h+='<button class="navbtn" data-act="prev-day" aria-label="Previous day">\u2039</button>';
      h+='<div class="center"><span class="date">'+(isToday?"Today":fmtDate(d).split(", ")[1]||fmtDate(d))+'</span><span class="sub">'+fmtDate(d)+'</span>';
      if(!isToday) h+='<br><button class="today-pill" data-act="goto-today">Back to today</button>';
      h+='</div>';
      h+='<button class="navbtn" data-act="next-day" aria-label="Next day">\u203a</button>';
      h+="</div>";
      return h;
    }

    /* --- Today — ledger table: persons (sticky first column) x items due --- */
    function todayView(){
      var d=state.selDate, ds=dstr(d), items=dueItems(d);
      var h=dateNav();
      h+='<div style="margin-top:12px;"><span class="viewtag today">Today \u00b7 one day</span></div>';
      h+="<h2 class=\"sec\" style=\"margin-top:6px;\">"+(canSeeAllTables()?"Who has done today?":"Have you done today?")+"</h2>";
      h+='<p class="note" style="margin:-4px 0 10px;">Status for '+fmtDate(d)+' only. For the whole week, open the Week tab.</p>';
      if(!canSeeAllTables()) h+='<p class="note" style="margin:-4px 0 10px;">You can only see your own table. Only Fikri Abi and Admin can see everyone\u2019s table.</p>';
      h+=statusBox("today", d);
      h+="<h2 class=\"sec\">Detail \u2014 item by item</h2>";
      if(!items.length){
        h+='<div class="empty">No items due on this day.</div>';
      }else{
        h+='<div class="tablebox" tabindex="0" role="region" aria-label="Today ledger table — scroll sideways inside the table for all items"><table class="ledger"><thead><tr><th class="person" scope="col">Person</th>';
        items.forEach(function(it){ h+='<th scope="col">'+esc(it.code)+"</th>"; });
        h+='<th class="total" scope="col">Total</th></tr></thead><tbody>';
        visibleMembers().forEach(function(p){
          var st=dayStats(p,d);
          var pct=st.total?Math.round(st.frac*100):0;
          h+="<tr>"+personCell(p, state.lastUpdated[p]?"Updated "+fmtTime(state.lastUpdated[p]):"No entries yet");
          items.forEach(function(it){
            var m=itemMark(p,d,it);
            h+='<td class="'+(m.cls==="done-mark"?"done-cell":"")+'"><span class="'+m.cls+'">'+esc(m.txt)+"</span></td>";
          });
          h+='<td class="total">'+pct+'%<span class="total-sub">'+st.done+"/"+st.total+" done</span></td></tr>";
        });
        h+="</tbody></table></div>";
        if(items.length>5) h+='<p class="scroll-hint">Scroll sideways inside the table to see all items. Tap a name to open that person\u2019s checklist.</p>';
      }
      h+='<p class="legend">'+items.map(function(it){return "<b>"+it.code+"</b> "+esc(it.name);}).join(" \u00b7 ")+"</p>";
      if(state.me===ADMIN_PERSON)
        h+='<p class="cta"><button class="primary" data-act="tab" data-v="week">See this week</button></p>';
      else
        h+='<p class="cta"><button class="primary" data-act="tab" data-v="mine">Open my checklist</button></p>';
      h+="<h2 class=\"sec\">Recent activity</h2>";
      var visibleActivity = canSeeAllTables() ? state.activity : state.activity.filter(function(a){ return a.person===state.me; });
      if(!visibleActivity.length) h+='<div class="empty">No activity yet. Completed items will appear here.</div>';
      else{
        h+='<div class="feed">';
        visibleActivity.slice(0,25).forEach(function(a){
          h+='<div><span class="fdot"></span><span style="flex:1;"><strong>'+esc(a.person)+'</strong> '+esc(a.action)+' '+esc(a.item_name)+'</span><span class="t">'+esc(fmtTime(a.created_at))+"</span></div>";
        });
        h+="</div>";
      }
      return h;
    }

    /* --- Checklist (mine / person detail) --- */
    function checklistView(person,date,editable){
      var ds=dstr(date), items=dueItems(date);
      var groups=["Daily","Weekly","Monthly"];
      var h="";
      groups.forEach(function(g){
        var gi=items.filter(function(it){return it.group===g;});
        if(!gi.length) return;
        h+='<div class="group-head">'+g+"</div>";
        gi.forEach(function(it){
          /* Fatir, already completed earlier this month: show it as done for
             the month instead of asking for it again on the next Tuesday. */
          if(it.id==="fatir" && !getCI(person,ds,it.id)){
            var fd=fatirDoneEarlier(person,date);
            if(fd){ h+=fatirDoneRow(it,fd); return; }
          }
          h+=itemRow(person,ds,it,editable);
        });
      });
      if(!items.length) h+='<div class="empty">No items due on this day.</div>';
      return h;
    }
    function fatirDoneRow(it,fd){
      return '<div class="item done"><div class="main"><span class="name">'+esc(it.name)+'</span>'+
        '<span class="badge">Done this month</span>'+
        '<div class="desc">Already completed this month, on '+fmtDate(parseD(fd))+".</div></div>"+
        '<span class="ro-mark"><span class="done-mark">\u2713 Done</span></span></div>';
    }
    function itemRow(person,ds,it,editable){
      var r=getCI(person,ds,it.id);
      var count=r?(r.count||0):0;
      var done=r ? (it.target ? (r.done || count>=it.target) : !!r.done) : false;
      var h='<div class="item'+(done?" done":"")+'">';
      if(editable){
        h+='<button class="cbox'+(done?" on":"")+'" data-act="toggle" data-p="'+esc(person)+
           '" data-item="'+it.id+'" aria-label="Mark done">'+(done?"\u2713":"")+"</button>";
      }
      h+='<div class="main"><span class="name">'+esc(it.name)+'</span>'+
         '<span class="badge">'+badgeFor(it)+'</span>'+
         '<div class="desc">'+esc(it.desc)+"</div></div>";
      if(it.target){
        if(editable){
          h+='<div class="counter">'+
             '<button data-act="dec" data-p="'+esc(person)+'" data-item="'+it.id+'" aria-label="Decrease">\u2212</button>'+
             '<span class="val">'+count+' <small>/ '+it.target+"</small></span>"+
             '<button data-act="inc" data-p="'+esc(person)+'" data-item="'+it.id+'" aria-label="Increase">+</button>';
          if(it.target>=100){
            h+='<span class="quick"><button data-act="incby" data-n="10" data-p="'+esc(person)+'" data-item="'+it.id+'">+10</button>'+
               '<button data-act="incby" data-n="100" data-p="'+esc(person)+'" data-item="'+it.id+'">+100</button>'+
               (it.target>=10000?'<button data-act="incby" data-n="1000" data-p="'+esc(person)+'" data-item="'+it.id+'">+1000</button>':"")+'</span>';
          }
          h+="</div>";
        }else{
          h+='<span class="ro-mark">'+(done?'<span class="done-mark">\u2713</span> ':'')+
             '<span class="cnt">'+count+" / "+it.target+"</span></span>";
        }
      }else if(it.juz){
        if(editable){
          /* Manual juz for this day (1\u201330). Stored in the check-in's count
             field, together with done, for this person and date only. */
          h+='<label class="juzpick">Juz reached<select data-juz="1" data-p="'+esc(person)+
             '" data-item="'+it.id+'" data-date="'+ds+'" aria-label="Juz reached">';
          h+='<option value="0"'+(count===0?" selected":"")+'>\u2014</option>';
          for(var jz=1;jz<=30;jz++) h+='<option value="'+jz+'"'+(count===jz?" selected":"")+'>Juz '+jz+'</option>';
          h+="</select></label>";
        }else{
          h+='<span class="ro-mark">'+(done?'<span class="done-mark">\u2713 Done</span>':'<span class="notdone">Not done</span>')+
             (count>0?'<span class="cnt">Juz '+count+"</span>":"")+"</span>";
        }
      }else if(!editable){
        h+='<span class="ro-mark">'+(done?'<span class="done-mark">\u2713 Done</span>':'<span class="notdone">Not done</span>')+"</span>";
      }
      h+="</div>";
      return h;
    }
    function personView(){
      var p=state.personView||state.me, d=state.selDate;
      var editable=canEdit(p);
      var h=dateNav();
      h+="<h2 class=\"sec\">"+esc(p)+"</h2>";
      h+='<p class="note" style="margin-top:-4px;">'+(state.lastUpdated[p]?"Last updated "+fmtTime(state.lastUpdated[p]):"No entries yet")+
         (editable?"":" \u00b7 Read-only")+"</p>";
      if(state.me===ADMIN_PERSON)
        h+='<p class="note" style="margin-top:-2px;">'+(state.admin
          ? "Admin mode is on \u2014 changes you make here are saved as corrections."
          : "Admin mode is off \u2014 this checklist is read-only. Turn Admin on (top right) to correct an entry.")+"</p>";
      h+="<h2 class=\"sec\">Last 7 days</h2>";
      h+='<div class="days-btn-container" role="radiogroup" aria-label="Choose a day">';
      for(var i=6;i>=0;i--){
        var dd=addDays(d,-i), m=cellMark(p,dd);
        h+='<label class="daypick"><input class="day-btn" type="radio" name="daystrip" data-daypick="1" value="'+dstr(dd)+'"'+
           (dstr(dd)===dstr(d)?" checked":"")+' aria-label="'+esc(fmtDate(dd))+'">'+
           '<span class="day-label" aria-hidden="true">'+DOW_S[(dd.getDay()+6)%7].charAt(0)+"</span>"+
           '<span class="day-meta">'+dd.getDate()+' <span class="'+m.cls+'">'+(m.txt||"\u00b7")+"</span></span></label>";
      }
      h+="</div>";
      h+="<h2 class=\"sec\">Checklist \u2014 "+fmtDate(d)+"</h2>";
      h+=checklistView(p,d,editable);
      return h;
    }

    /* --- Week — ledger table: persons (sticky first column) x days --- */
    function weekView(){
      var ws=state.weekStart;
      var h='<div class="datenav"><button class="navbtn" data-act="prev-week" aria-label="Previous week">\u2039</button>'+
        '<div class="center"><span class="date">Week of '+ws.getDate()+" "+MON_S[ws.getMonth()]+'</span><span class="sub">'+fmtDate(ws)+" \u2013 "+fmtDate(addDays(ws,6))+'</span></div>'+
        '<button class="navbtn" data-act="next-week" aria-label="Next week">\u203a</button></div>';
      h+='<div style="margin-top:12px;"><span class="viewtag week">Week \u00b7 7 days</span></div>';
      h+="<h2 class=\"sec\" style=\"margin-top:6px;\">"+(canSeeAllTables()?"Who has done this week?":"Have you done this week?")+"</h2>";
      h+='<p class="note" style="margin:-4px 0 10px;">Status for the whole week, '+fmtDate(ws)+" \u2013 "+fmtDate(addDays(ws,6))+'. For a single day, open the Today tab.</p>';
      if(!canSeeAllTables()) h+='<p class="note" style="margin:-4px 0 10px;">You can only see your own table. Only Fikri Abi and Admin can see everyone\u2019s table.</p>';
      h+=statusBox("week", ws);
      h+="<h2 class=\"sec\">Detail \u2014 day by day</h2>";
      h+='<div class="tablebox" tabindex="0" role="region" aria-label="Week ledger table"><table class="ledger ledger-week"><thead><tr><th class="person" scope="col">Person</th>';
      for(var i=0;i<7;i++){ var dh=addDays(ws,i);
        h+='<th scope="col">'+DOW_S[i]+"<small>"+dh.getDate()+" "+MON_S[dh.getMonth()]+"</small></th>"; }
      h+='<th class="total" scope="col">Week</th></tr></thead><tbody>';
      visibleMembers().forEach(function(p){
        var totFrac=0;
        for(var k=0;k<7;k++) totFrac+=dayStats(p,addDays(ws,k)).frac;
        var pct=Math.round(totFrac/7*100);
        h+="<tr>"+personCell(p, state.lastUpdated[p]?"Updated "+fmtTime(state.lastUpdated[p]):"No entries yet");
        for(var j=0;j<7;j++){ var d2=addDays(ws,j), m=cellMark(p,d2);
          h+='<td class="'+(m.cls==="done-mark"?"done-cell":"")+'"><span class="'+m.cls+'">'+esc(m.txt||"\u00b7")+"</span></td>"; }
        h+='<td class="total">'+pct+"%</td></tr>";
      });
      h+="</tbody></table></div>";
      h+='<p class="scroll-hint">Tap a name to open that person\u2019s checklist.</p>';
      h+="<h2 class=\"sec\">Günlük Hatmi Quran \u2014 juz reached each day</h2>";
      h+='<div class="tablebox" tabindex="0" role="region" aria-label="Günlük Hatmi Quran juz table"><table class="ledger"><thead><tr><th class="person" scope="col">Person</th>';
      for(var i2=0;i2<7;i2++){ var dh2=addDays(ws,i2);
        h+='<th scope="col">'+DOW_S[i2]+"<small>"+dh2.getDate()+" "+MON_S[dh2.getMonth()]+"</small></th>"; }
      h+="</tr></thead><tbody>";
      visibleMembers().forEach(function(p){
        h+="<tr>"+personCell(p,"");
        for(var j2=0;j2<7;j2++){ var d3=addDays(ws,j2), rr=getCI(p,dstr(d3),"gunlukhatmi");
          h+='<td class="'+(rr&&rr.done?"done-cell":"")+'">'+juzCell(p,d3)+"</td>"; }
        h+="</tr>";
      });
      h+="</tbody></table></div>";
      h+='<p class="note" style="padding:0 4px;">The juz is entered by each person for that day. \u2014 = no juz entered for that day.</p>';
      h+='<p class="note" style="padding:0 4px;">\u2713 = all items done that day. A fraction such as 2/3 = items done out of items due. \u2014 in red = a past day with nothing recorded.</p>';
      h+='<p class="cta"><button class="primary" data-act="export-xlsx">Export this week to Excel</button></p>';
      return h;
    }
    function exportView(){
      var scope = canSeeAllTables()
        ? "the 5 members \u00d7 days, with the weekly percentage"
        : "your row only \u2014 1 person \u00d7 days, with the weekly percentage. Other members\u2019 rows are not visible to you";
      return "<h2 class=\"sec\">Export</h2>"+
        '<div class="empty" style="color:var(--ink);">Downloads the weekly table ('+scope+') '+
        "for the week of "+fmtDate(state.weekStart)+' as an Excel file.<br><br>'+
        '<button class="primary" data-act="export-xlsx">Export weekly table to Excel</button></div>';
    }
    function doExport(){
      var ws=state.weekStart;
      var head=["Person"]; var i,dd;
      for(i=0;i<7;i++){ dd=addDays(ws,i); head.push(DOW_S[i]+" "+dd.getDate()+" "+MON_S[dd.getMonth()]); }
      head.push("Weekly %");
      var rows=[head];
      visibleMembers().forEach(function(p){
        var row=[p], tot=0;
        for(var i=0;i<7;i++){ var d2=addDays(ws,i), m=cellMark(p,d2);
          tot+=dayStats(p,d2).frac;
          row.push(m.txt===""?"":(m.cls==="missed"?"missed":m.txt)); }
        row.push(Math.round(tot/7*100)+"%");
        rows.push(row);
      });
      var fname="daily-ibadah-week-"+dstr(ws)+".xlsx";
      if(window.XLSX){
        var wsx=XLSX.utils.aoa_to_sheet(rows);
        var wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,wsx,"Week");
        XLSX.writeFile(wb,fname);
      }else{
        var csv=rows.map(function(r){return r.map(function(c){
          return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
        var a=document.createElement("a");
        a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
        a.download=fname.replace(".xlsx",".csv"); a.click();
        setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
      }
    }

    /* --- Admin panel --- */
    function adminPanel(){
      if(state.me!==ADMIN_PERSON) return "";
      return '<div class="modal"><h3>Admin</h3>'+
        (state.admin
          ? '<p class="note" style="margin:0 0 8px;">Admin mode is on. This Admin profile is the only admin \u2014 Fikri Abi and the others are regular members. Admin has no checklist of its own; it only oversees the 5 members. Open any person and any day: edits you make to someone else\u2019s checklist are saved as corrections and recorded in the activity feed.</p>'+
            '<div class="rowflex"><button data-act="admin-off">Turn admin off</button></div>'
          : '<p class="note" style="margin:0 0 8px;">Only this Admin profile can correct entries. Enter the admin PIN to correct a past entry. If no admin PIN has been set yet, the PIN you enter becomes the admin PIN.</p>'+
            '<form id="admin-form" class="rowflex"><input name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4-digit PIN" autocomplete="off" style="width:150px;">'+
            uiBtn("Continue",'type="submit"')+'</form>')+
        '<div class="err" id="admin-err"></div></div>';
    }

    /* --- Primary submit button — plain dark-green "Continue" button ---
       Full-width, white "Continue" text centred, as in the reference
       screenshot. Replaces the previous Uiverse spin button. */
    function uiBtn(label, attrs){
      return '<button class="continue-btn" '+attrs+'>'+esc(label)+'</button>';
    }

    /* --- "loading" loader (Uiverse.io by andrew-manzyk) ---
       9 clipped slices; each slice holds the word "loading" in a scrolling
       span, plus the wobble line. Loading screen only — no FAYSALABAD text
       here. The login screen below shows FAYSALABAD as plain text, not
       this markup. */
    function loaderMarkup(){
      var h='<div class="loader" role="img" aria-label="loading">';
      for(var i=0;i<9;i++) h+='<div class="text" aria-hidden="true"><span>loading</span></div>';
      h+='<div class="line" aria-hidden="true"></div></div>';
      return h;
    }
    /* --- Loading screen: dark Jet Black, white loader, no button.
       Shows for exactly 2 seconds, then render() moves on by itself. --- */
    function loaderView(){
      return '<div class="loadscreen">'+loaderMarkup()+"</div>";
    }

    /* --- Identity setup --- */
    function setupView(){
      var h='<div class="setup"><div class="setup-brand">FAYSALABAD</div><h1>Choose your name</h1>'+
        "<p>Choose your name and enter your 4-digit PIN. First time? The PIN you enter becomes your PIN for this name. This device remembers you — your checklist is shared live with the group.</p>"+
        '<div class="namelist" role="listbox" aria-label="Choose your name">';
      PEOPLE.forEach(function(p){
        h+='<button data-act="pick-name" data-p="'+esc(p)+'" class="'+(state.setupName===p?"sel":"")+'" aria-selected="'+(state.setupName===p)+'"><span>'+esc(p)+(p===ADMIN_PERSON?'<span class="sub">Oversight only \u2014 no checklist</span>':"")+'</span></button>';
      });
      h+='</div><form id="setup-form"><div class="pinrow">'+
         '<input id="setup-pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="\u2022 \u2022 \u2022 \u2022" autocomplete="off" enterkeyhint="go" aria-label="4-digit PIN">'+
         uiBtn("Continue",'type="submit"')+'</div>'+
         '<div class="err">'+esc(state.setupMsg)+"</div></form>"+
         '<p class="note" style="text-align:center;margin-top:auto;padding-top:24px;">5 members + Admin \u00b7 Shared live \u00b7 Admin oversees only, no checklist</p></div>';
      return h;
    }

    /* ============ Events ============ */
    document.addEventListener("click",function(e){
      var el=e.target.closest("[data-act]"); if(!el) return;
      var act=el.getAttribute("data-act");
      if(act==="reload"){ location.reload(); }
      else if(act==="tab"){ state.view=el.getAttribute("data-v"); state.adminPanel=false; ensureRange(state.selDate).then(render); render(); }
      else if(act==="prev-day"){ state.selDate=addDays(state.selDate,-1); ensureRange(state.selDate).then(render); render(); }
      else if(act==="next-day"){ state.selDate=addDays(state.selDate,1); ensureRange(state.selDate).then(render); render(); }
      else if(act==="goto-today"){ state.selDate=new Date(); ensureRange(state.selDate).then(render); render(); }
      else if(act==="prev-week"){ state.weekStart=addDays(state.weekStart,-7); ensureRange(state.weekStart).then(render); render(); }
      else if(act==="next-week"){ state.weekStart=addDays(state.weekStart,7); ensureRange(state.weekStart).then(render); render(); }
      else if(act==="open-person"){ var pp=el.getAttribute("data-p");
        if(pp===ADMIN_PERSON){ state.view="today"; render(); return; }
        if(!canSeePerson(pp)){ state.view="today"; render(); return; }
        state.personView=pp; state.view="person"; render(); }
      else if(act==="pick-name"){ state.setupName=el.getAttribute("data-p"); state.setupMsg=""; render(); var inp=document.getElementById("setup-pin"); if(inp) inp.focus(); }
      else if(act==="switch"){ try{localStorage.removeItem("ibadah-identity");}catch(err){}
        state.me=null; state.admin=false; state.setupName=null; state.setupMsg=""; render(); }
      else if(act==="admin"){ if(state.me!==ADMIN_PERSON){ state.admin=false; state.adminPanel=false; render(); return; } state.adminPanel=!state.adminPanel; render(); }
      else if(act==="admin-off"){ state.admin=false; state.adminPanel=false; render(); }
      else if(act==="export-xlsx"){ doExport(); }
      else if(act==="toggle"||act==="inc"||act==="dec"||act==="incby"){
        var person=el.getAttribute("data-p"), item=ITEM_BY_ID[el.getAttribute("data-item")];
        if(!item || !canEdit(person)) return;
        var ds=dstr(state.selDate), r=getCI(person,ds,item.id);
        var count=r?(r.count||0):0, done=r?!!r.done:false;
        if(act==="toggle"){ if(item.target){ setCheck(person,ds,item, !done, done?0:item.target); }
          else if(item.juz){ setCheck(person,ds,item,!done,count); }
          else setCheck(person,ds,item,!done,0); }
        else if(act==="inc") setCheck(person,ds,item,false,count+1);
        else if(act==="dec") setCheck(person,ds,item,false,count-1);
        else if(act==="incby") setCheck(person,ds,item,false,count+parseInt(el.getAttribute("data-n"),10));
      }
    });
    /* Juz picker (Günlük Hatmi Quran only): choosing a juz marks that day's
       hatmi done and stores the juz with the check-in; \u2014 clears the juz. */
    document.addEventListener("change",function(e){
      /* Day selector (person view, Last 7 days): picking a day loads that
         day's checklist below. */
      var dp=e.target && e.target.closest ? e.target.closest("[data-daypick]") : null;
      if(dp){ state.selDate=parseD(dp.value); ensureRange(state.selDate).then(render); render(); return; }
      var el=e.target && e.target.closest ? e.target.closest("[data-juz]") : null;
      if(!el) return;
      var person=el.getAttribute("data-p"), item=ITEM_BY_ID[el.getAttribute("data-item")];
      if(!item || !item.juz){ return; }
      if(!canEdit(person)){ render(); return; }
      var ds=el.getAttribute("data-date")||dstr(state.selDate);
      var juz=Math.max(0,Math.min(30,parseInt(el.value,10)||0));
      var r=getCI(person,ds,item.id);
      var done=r?!!r.done:false;
      if(juz>0) done=true;
      setCheck(person,ds,item,done,juz);
    });
    document.addEventListener("submit",function(e){
      if(e.target.id==="setup-form"){
        e.preventDefault();
        var pin=(document.getElementById("setup-pin").value||"").trim();
        if(!state.setupName){ state.setupMsg="Choose your name first."; render(); return; }
        if(!/^\d{4}$/.test(pin)){ state.setupMsg="Enter a 4-digit PIN."; render(); return; }
        var person=state.setupName;
        pinHash(person,pin).then(function(hash){
          return sb.from("identities").select("person,pin_hash").eq("person",person).maybeSingle()
          .then(function(res){
            if(res.error){ noteError(res.error); if(!state.setupError){ state.setupMsg="Could not check the PIN. Try again."; render(); } return; }
            if(res.data){
              if(res.data.pin_hash!==hash){ state.setupMsg="That PIN does not match the PIN set for "+person+"."; render(); return; }
              finishSetup(person);
            }else{
              sb.from("identities").insert({person:person,pin_hash:hash}).then(function(r2){
                if(r2.error){ noteError(r2.error); state.setupMsg="Could not save the PIN. Try again."; render(); return; }
                finishSetup(person);
              });
            }
          });
        });
      }
      if(e.target.id==="admin-form"){
        e.preventDefault();
        if(state.me!==ADMIN_PERSON){ state.admin=false; state.adminPanel=false; render(); return; }
        var pin=(e.target.querySelector("input[name=pin]").value||"").trim();
        var errEl=document.getElementById("admin-err");
        if(!/^\d{4}$/.test(pin)){ errEl.textContent="Enter a 4-digit PIN."; return; }
        pinHash("admin",pin).then(function(hash){
          sb.from("settings").select("key,value").eq("key","admin_pin_hash").maybeSingle()
          .then(function(res){
            if(res.error){ noteError(res.error); errEl.textContent="Could not check the admin PIN."; return; }
            if(res.data){
              if(res.data.value!==hash){ errEl.textContent="That is not the admin PIN."; return; }
              state.admin=true; render();
            }else{
              sb.from("settings").insert({key:"admin_pin_hash",value:hash}).then(function(r2){
                if(r2.error){ errEl.textContent="Could not save the admin PIN."; return; }
                state.admin=true; render();
              });
            }
          });
        });
      }
    });
    function finishSetup(person){
      state.me=person;
      purgeHidden();
      if(person!==ADMIN_PERSON){ state.admin=false; state.adminPanel=false; }
      try{ localStorage.setItem("ibadah-identity", JSON.stringify({person:person})); }catch(e){}
      state.view="today"; state.setupMsg="";
      ensureRange(new Date()).then(render); render();
    }
    window.addEventListener("online",function(){ state.online=true; flushQueue(); render(); });
    window.addEventListener("offline",function(){ state.online=false; render(); });

    /* ============ Boot ============ */
    function boot(){
      if(!window.supabase || !window.supabase.createClient){
        state.bootError="The Supabase library could not be loaded. Check your connection and try again.";
        render(); return;
      }
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      /* Probe the tables so a missing setup shows a clear error, not fake data. */
      sb.from("identities").select("person").limit(1).then(function(res){
        if(res.error){ noteError(res.error);
          if(!state.setupError){ state.bootError="Could not reach the database: "+(res.error.message||"unknown error"); }
          render(); return; }
        ensureRange(new Date()).then(function(){
          render();
          /* Realtime: other people's updates appear without a refresh. */
          try{
            /* Non-privileged members subscribe with a server-side Realtime
               filter, so other members' rows are never delivered to their
               browser at all (their REST loads are filtered the same way in
               loadCheckins / loadActivity). Fikri Abi and Admin, who may see
               everyone, subscribe unfiltered. The handler guard below stays
               as a second layer. */
            var rtOwn = state.me && !canSeeAllTables();
            var rtCheckins = rtOwn
              ? {event:"*",schema:"public",table:"checkins",filter:"person=eq."+state.me}
              : {event:"*",schema:"public",table:"checkins"};
            var rtActivity = rtOwn
              ? {event:"*",schema:"public",table:"activity",filter:"person=eq."+state.me}
              : {event:"*",schema:"public",table:"activity"};
            sb.channel("ibadah-live")
              .on("postgres_changes",rtCheckins,function(payload){
                if(payload.new && payload.new.person){
                  if(state.me && !canSeePerson(payload.new.person)) return;
                  mergeRow(payload.new);
                }
                render();
              })
              .on("postgres_changes",rtActivity,function(){
                loadActivity().then(render);
              })
              .subscribe();
          }catch(e){}
          /* Fallback refresh in case Realtime is not enabled on the project. */
          setInterval(function(){ if(state.me && !state.setupError){ ensureRange(state.selDate).then(render); } }, 25000);
        });
      }).catch(function(){
        state.online = navigator.onLine;
        state.bootError = state.online ? "Could not reach the database." :
          "You are offline. The tracker needs a connection for the first load.";
        render();
      });
    }
    /* The loading screen lasts exactly 2 seconds, then the app moves on
       by itself — to the name picker, or into the tracker when this device
       already remembers who is signed in. */
    setTimeout(function(){ state.loaderDone=true; render(); }, 2000);
    boot();
    </script>
  </body>
